<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Juan Beltran App</title>
<meta name="theme-color" content="#173C32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Juan Beltran">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>html,body{margin:0;padding:0}</style>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: inicio de consola — barra superior (perfil + hora), título del juego seleccionado, fila de tarjetas grandes, dock de botones redondos; cada botón abre una pantalla completa */
:root{
  --bg:#EBEBEB; --panel:#FFFFFF; --panel-2:#F3F3F3; --fg:#2D2D2D; --muted:#808080; --line:#D6D6D6;
  --sel:#14C8E6; --sel-2:#0AB1E0;
  --news:#3DBE6E; --shop:#F0502A; --album:#3C8DF0; --online:#E60012; --share:#19C2B4; --grey:#7A7A7A;
  --verde:#173C32; --hueso:#F3EBDD; --dot:#1E90FF;
  --good:#1E9E5A; --warn:#D08A00; --bad:#D9372A;
  --pole:#E0A200; --podio:#2F7FE0; --rookie:#8E44D6; --box:#8A8A8A;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Arial Rounded MT Bold",system-ui,sans-serif;
  --shadow:0 1px 0 rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2D2D2D;--panel:#464646;--panel-2:#3A3A3A;--fg:#F2F2F2;--muted:#A6A6A6;--line:#555555;--shadow:0 1px 0 rgba(0,0,0,.2),0 6px 18px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2D2D2D;--panel:#464646;--panel-2:#3A3A3A;--fg:#F2F2F2;--muted:#A6A6A6;--line:#555555;--shadow:0 1px 0 rgba(0,0,0,.2),0 6px 18px rgba(0,0,0,.35);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%}
input,select,textarea{max-width:100%;min-width:0}
input[type=date].in{-webkit-appearance:none;appearance:none;min-height:40px;display:block}
@media(max-width:640px){.in{font-size:16px}}
.field>*{min-width:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* arranque */
#splash{position:fixed;inset:0;z-index:100;background:#0E0E0C;overflow:hidden;transition:opacity .6s;--b:.07;--g:0}
#splash.out{opacity:0;pointer-events:none}
#splash .stage{position:absolute;left:50%;top:50%;width:max(100vw,calc(100vh * 0.5629));aspect-ratio:577/1025;transform:translate(-50%,-50%)}
#splash .lamp{position:absolute;inset:0;width:100%;height:100%;filter:brightness(var(--b));transition:filter .25s}
#splash .glow{position:absolute;left:10%;right:10%;top:36%;height:45%;background:radial-gradient(50% 50% at 50% 20%,rgba(255,236,200,.22),transparent 70%);opacity:var(--g);pointer-events:none;transition:opacity .3s}
#splash .lg{position:absolute;left:29.2%;top:71.3%;width:39.9%;color:#F3EBDD;opacity:0;transform:translateY(6px);transition:opacity .8s ease,transform .8s ease}
#splash .lg svg{width:100%;height:auto;display:block}
#splash.lit .lg{opacity:1;transform:none}
#splash.on .lamp{animation:lampOn 1.1s steps(1,end) forwards}
@keyframes lampOn{0%{filter:brightness(.6)}12%{filter:brightness(.1)}22%{filter:brightness(.8)}30%{filter:brightness(.15)}42%{filter:brightness(.95)}50%{filter:brightness(.4)}60%,100%{filter:brightness(1)}}
#splash.on .glow{opacity:1;transition-delay:.65s}
#splash .msg{position:absolute;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));font-size:12px;color:rgba(243,235,221,.5);text-align:center}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.screen[hidden]{display:none!important}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* inicio */
.top{display:flex;align-items:center;justify-content:space-between;padding-block:14px 4px}
.me{display:flex;align-items:center;gap:10px}
.av{width:44px;height:44px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;box-shadow:var(--shadow);border:3px solid var(--panel)}
.av svg{width:28px}
.me b{font-weight:800;font-size:15px}
.topidea{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;transition:transform .12s,box-shadow .12s}
.topidea span{width:28px;height:28px;display:block}.topidea svg{width:100%;height:100%}
.topidea:hover,.topidea:focus-visible{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--sel)}.topidea:active{transform:scale(.92)}
.home-mid{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.gtitle{display:flex;align-items:center;gap:8px;min-height:30px;font-weight:700;font-size:17px;padding-bottom:10px}
.gtitle .ic{width:22px;height:22px;border-radius:4px;overflow:hidden;flex:0 0 auto;display:grid;place-items:center;font-size:10px;color:#fff;font-weight:800}
.gtitle .ic.cardic{color:var(--fg);border-radius:0}.gtitle .ic.cardic svg{width:22px;height:22px}
.gtitle .ic img{width:100%;height:100%;object-fit:cover}
.gtitle span{min-width:0;overflow-wrap:anywhere}
.row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-block:8px 18px;scrollbar-width:none;scroll-padding-left:max(16px,env(safe-area-inset-left,0px))}
.row::-webkit-scrollbar{display:none}
.row::after{content:"";flex:0 0 max(40vw,calc(100vw - min(58vw,280px) - 60px))}
.tile{flex:0 0 auto;width:min(58vw,280px);aspect-ratio:1;border-radius:4px;background:var(--panel);box-shadow:var(--shadow);scroll-snap-align:start;position:relative;transition:transform .15s}
.tile .art{position:absolute;inset:0;border-radius:4px;overflow:hidden;display:grid;place-items:center}
.tile .art img{width:100%;height:100%;object-fit:cover}
.tile .mono{font-weight:800;color:#fff;text-align:center;padding:14px;line-height:1.02;letter-spacing:-.01em;overflow-wrap:anywhere}
.tile.sel{box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--sel);animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--sel-2)}}
.emptyhome{width:min(58vw,280px);aspect-ratio:1;border-radius:4px;border:3px dashed var(--line);display:grid;place-items:center;text-align:center;color:var(--muted);padding:20px;font-weight:700;flex:0 0 auto}
.dock{display:flex;justify-content:safe center;gap:12px;padding-block:12px 12px;overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.rb{display:flex;flex-direction:column;align-items:center;gap:5px;flex:0 0 auto;width:58px}
.rb .c{width:52px;height:52px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;position:relative;transition:transform .12s,box-shadow .12s}
.rb:hover .c,.rb:focus-visible .c{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--sel)}
.rb:active .c{transform:scale(.92)}
.rb .c svg{width:28px;height:28px}
.rb span.l{font-size:10px;font-weight:700;color:var(--muted);text-align:center;line-height:1.1;white-space:nowrap}
@media(max-width:560px){.dock{gap:0;justify-content:space-between}.rb{width:auto;flex:1 1 0;min-width:0}.rb .c{width:min(44px,10.6vw);height:min(44px,10.6vw)}.rb .c svg{width:62%;height:62%}.rb span.l{font-size:8px;max-width:100%;overflow:hidden;text-overflow:ellipsis}.badge{width:11px;height:11px}}
.rb .c{background:#FFFFFF!important}.rb .c.online{background:#173C32!important}
.badge{position:absolute;top:1px;right:1px;width:13px;height:13px;border-radius:50%;background:var(--dot);border:2px solid var(--bg)}
.foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-block:8px 6px;font-size:12px;color:var(--muted);margin-inline:max(16px,env(safe-area-inset-left,0px))}
.kbd{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:10px;font-weight:800;margin-right:4px}

/* encabezados */
.hd{display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);background:var(--bg)}
.back{width:40px;height:40px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;flex:0 0 auto;color:var(--fg)}
.back svg{width:20px}
.hd h1{font-size:19px;font-weight:800;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .hico{width:34px;height:34px;flex:0 0 auto}
#events .hico{background:#173C32;border-radius:50%;padding:4px;box-sizing:border-box}
.hd .logo{width:40px;height:40px;border-radius:6px;overflow:hidden;flex:0 0 auto;display:grid;place-items:center;font-weight:800;color:#fff}
.hd .logo img{width:100%;height:100%;object-fit:cover}
.body{flex:1;overflow-y:auto;padding-block:14px 40px;-webkit-overflow-scrolling:touch;min-height:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:999px;background:var(--panel);font-weight:700;font-size:13.5px;white-space:nowrap;box-shadow:var(--shadow)}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.wrapmax{max-width:860px;margin:0 auto}

/* controles */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:999px;font-weight:800;background:var(--fg);color:var(--bg);font-size:14px}
.btn.ghost{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}
.btn.danger{background:var(--bad);color:#fff}
.btn.accent{background:var(--sel-2);color:#fff}
.btn.sm{padding:6px 12px;font-size:12.5px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lab{font-size:12px;font-weight:700;color:var(--muted)}
.in{width:100%;padding:9px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);min-width:0}
.in:focus{border-color:var(--sel);outline:none}
textarea.in{resize:vertical;min-height:70px}
.add-picker{position:relative;flex:1;min-width:220px;max-width:100%}
.add-picker .in{width:100%}
.add-search-icon{position:absolute;left:13px;top:9px;z-index:1;pointer-events:none;font-size:18px;color:var(--muted)}
.add-results{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:25;max-height:300px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:5px}
.add-results[hidden]{display:none}
.add-results button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:9px 10px;border-radius:8px;text-align:left}
.add-results button:hover{background:var(--panel-2)}
.add-results small{display:block;color:var(--muted);font-size:11px}
.add-results .add-action{font-size:11px;white-space:nowrap;color:var(--shop)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:440px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.span2{grid-column:span 2}
.card{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.rowx{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.empty{padding:26px 12px;text-align:center;color:var(--muted)}
.chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800;color:#fff;white-space:nowrap}
.chip.good{background:var(--good)}.chip.warn{background:var(--warn)}.chip.bad{background:var(--bad)}
.chip.pole{background:var(--pole)}.chip.podio{background:var(--podio)}.chip.rookie{background:var(--rookie)}.chip.box{background:var(--box)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:13.5px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.ex{font-size:11px;font-weight:800;color:var(--warn);text-transform:uppercase;letter-spacing:.06em}
.x{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
.x:hover{background:var(--panel-2)}
.sec{font-size:17px;font-weight:800;margin:0}

/* listas tipo tarjeta */
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.rc{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left}
.rc h3{margin:0;font-size:16px;font-weight:800}
.k3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.k3 div{background:var(--panel-2);border-radius:10px;padding:7px 8px;min-width:0}
.k3 small{display:block;font-size:10.5px;color:var(--muted);font-weight:700}
.k3 b{font-size:14px}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:13.5px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:11.5px;color:var(--muted);font-weight:800;background:var(--panel-2)}
td:first-child,th:first-child{text-align:left}
td .in{padding:6px 8px;border-radius:8px}
.w-name{min-width:150px}
.bar-p{height:6px;border-radius:3px;background:var(--panel-2);margin-top:3px;overflow:hidden}
.bar-p i{display:block;height:100%;background:var(--sel)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.kpi{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:12px;min-width:0}
.kpi small{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.kpi b{font-size:20px;font-weight:800}
.kpi.hl{background:#173C32;color:#F3EBDD}.kpi.hl small{color:rgba(243,235,221,.75)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.pk{display:flex;flex-direction:column;gap:6px;text-align:left}
.pk .sq{aspect-ratio:1;border-radius:4px;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;box-shadow:var(--shadow);text-align:center;padding:6px;position:relative}
.pk .sq img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.pk b{font-size:13.5px;font-weight:700}
.pk small{color:var(--muted);font-size:12px}

/* tienda (compras) */
.shop{--shop:#B8913A}
.shop .hd{background:#173C32;color:#F3EBDD;border:0;box-shadow:inset 0 -3px 0 #B8913A}
.shop .hd h1{letter-spacing:.01em}
.shop .side button[aria-current="true"]{color:#173C32;border-left-color:#B8913A;background:rgba(184,145,58,.12)}
:root[data-theme="dark"] .shop .side button[aria-current="true"]{color:#E3C77E}
.carou{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:10px}
.carou::-webkit-scrollbar{display:none}
.carou .hero{flex:0 0 100%;scroll-snap-align:start;min-height:190px}
.hero .tagn{align-self:flex-start;background:#B8913A;color:#173C32;font-weight:800;font-size:10.5px;letter-spacing:.1em;padding:3px 8px;border-radius:4px}
.hero .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(23,60,50,.55),transparent 55%)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:-6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:#B8913A;width:18px;border-radius:4px}
.secbar{display:flex;align-items:baseline;gap:8px}
.secbar .more{margin-left:auto;font-weight:800;font-size:13px;color:#B8913A}
.hrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;scroll-snap-type:x proximity}
.hrow::-webkit-scrollbar{display:none}
.hrow .gt{flex:0 0 136px;scroll-snap-align:start}
.shop .fab{background:#173C32;color:#F3EBDD;box-shadow:0 0 0 3px #B8913A,0 8px 20px rgba(23,60,50,.4)}
.shop-tag{display:inline-block;font-size:11px;font-weight:800;color:#B8913A;letter-spacing:.06em;text-transform:uppercase}
.shopwrap{flex:1;display:flex;min-height:0}
.side{width:200px;flex:0 0 auto;border-right:1px solid var(--line);overflow-y:auto;padding-block:10px;background:var(--panel-2)}
.side button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;text-align:left;font-weight:700;border-left:4px solid transparent}
.side button[aria-current="true"]{border-left-color:var(--shop);background:var(--panel);color:var(--shop)}
.side .lg{width:30px;height:30px;border-radius:4px;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px;flex:0 0 auto}
.side .lg img{width:100%;height:100%;object-fit:cover}
.sitems{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.si{background:var(--panel);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.si .pic{aspect-ratio:1;display:grid;place-items:center;font-weight:800;font-size:28px;color:#fff;position:relative;overflow:hidden}
.si .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.si .pic .qty{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);padding:2px 9px;border-radius:999px;font-size:12.5px;color:#fff}
.si .meta{padding:9px 10px;display:flex;flex-direction:column;gap:6px}
.si .meta b{font-size:14px;overflow-wrap:anywhere}
.si.done{opacity:.5}.si.done .meta b{text-decoration:line-through}
@media(max-width:640px){.shopwrap,.splitwrap{flex-direction:column}.side{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}.side button{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;border-radius:8px}.side button[aria-current="true"]{border-bottom-color:var(--shop)}}


.shop .back{background:rgba(255,255,255,.18);color:#fff;box-shadow:none}
.shop .side{background:var(--panel)}
.shop .side .ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);flex:0 0 auto}
.eq{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:999px;box-shadow:var(--shadow);padding:4px 6px 4px 14px}
.eq input{border:0;background:none;flex:1;min-width:0;padding:8px 0;outline:none}
.hero{position:relative;border-radius:10px;overflow:hidden;min-height:180px;display:flex;align-items:flex-end;color:#fff;box-shadow:var(--shadow);text-align:left;width:100%}
.hero .bg{position:absolute;inset:0;display:grid;place-items:center;font-size:96px;font-weight:800;color:rgba(255,255,255,.22)}
.hero .bg img{width:100%;height:100%;object-fit:cover}
.hero .cap{position:relative;width:100%;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.75));display:flex;flex-direction:column;gap:4px}
.hero .cap small{font-weight:800;letter-spacing:.08em;font-size:11px;opacity:.85}
.hero .cap b{font-size:22px;font-weight:800}
.shelf2{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px 12px}

<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9);
const COP=new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
const money=v=>COP.format(isFinite(v)?v:0);
const pct=v=>(isFinite(v)?(v*100).toFixed(1):'0.0')+'%';
const n=v=>{const x=parseFloat(String(v??'').replace(/\./g,'').replace(',','.'));return isFinite(x)?x:0};
const pm=v=>{let t=String(v??'').replace(/[^0-9.,-]/g,'');if(!t)return 0;if(t.includes('.')&&t.includes(',')){t=t.lastIndexOf(',')>t.lastIndexOf('.')?t.replace(/\./g,'').replace(',','.'):t.replace(/,/g,'')}else if(/^-?\d{1,3}([.,]\d{3})+$/.test(t))t=t.replace(/[.,]/g,'');else t=t.replace(',','.');const x=parseFloat(t);return isFinite(x)?x:0};
const nd=v=>{const x=parseFloat(String(v??'').replace(',','.'));return isFinite(x)?x:0};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const TONES=['#1F1F1F','#C8402F','#173C32','#2F6FD6','#7A4BC2','#B8860B','#E8641E','#1E8E5A'];
const UNITS=['g','ml','und','kg','L','oz'];
const today=()=>new Date().toISOString().slice(0,10);
const fdate=d=>d?new Date(d+'T12:00').toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'}):'';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2300)}
const BACK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';

/* ---------- íconos del dock (estilo consola, dibujos propios) ---------- */
const IC={
 news:'<svg viewBox="0 0 32 32"><rect x="4" y="6" width="24" height="19" rx="4" fill="#1F5B45"/><rect x="9" y="11" width="14" height="2.6" rx="1.3" fill="#F3EBDD"/><rect x="9" y="16" width="9" height="2.6" rx="1.3" fill="#F3EBDD"/><path d="M8.5 24.5 6.5 29l6.5-4.5z" fill="#1F5B45"/></svg>',
 shop:'<svg viewBox="0 0 32 32" fill="none" stroke="#C08A2E" stroke-width="2.8" stroke-linejoin="round"><path d="M6 11h20l-1.6 15H7.6z"/><path d="M11.5 11V9a4.5 4.5 0 0 1 9 0v2" stroke-linecap="round"/></svg>',
 shopW:'<svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.8" stroke-linejoin="round"><path d="M6 11h20l-1.6 15H7.6z"/><path d="M11.5 11V9a4.5 4.5 0 0 1 9 0v2" stroke-linecap="round"/></svg>',
 album:'<svg viewBox="0 0 32 32"><rect x="4" y="7" width="24" height="18" rx="3" fill="none" stroke="#2E7D5B" stroke-width="2.8"/><circle cx="11" cy="13" r="2.2" fill="#C08A2E"/><path d="M8 22l6-7 4 4 3-3 4 6z" fill="#2E7D5B"/></svg>',
 online:'<svg viewBox="0 0 32 32" fill="none" stroke="#F3EBDD" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h6l-1 7a3 3 0 0 1-4 0zM12 15v9M9 24h6"/><path d="M18 6h6l-1 7a3 3 0 0 1-4 0zM21 15v9M18 24h6"/></svg>',
 share:'<svg viewBox="0 0 32 32" fill="none" stroke="#2C6E63" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"><path d="M5 17v8h22v-8"/><path d="M5 17h6l2 3h6l2-3h6"/><path d="M10 12h12M12 8h8"/></svg>',
 card:'<svg viewBox="0 0 32 32" fill="none" stroke="#8C8C8C" stroke-width="2.6" stroke-linejoin="round"><path d="M9 4h11l4 4v18a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M12 17l4 4 4-4M16 11v10" stroke-linecap="round"/></svg>',
 cardS:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"><path d="M9 4h11l4 4v18a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M11 9h7" stroke-linecap="round"/></svg>',
 ctrl:'<svg viewBox="0 0 32 32" fill="none" stroke="#8C8C8C" stroke-width="2.4" stroke-linejoin="round"><path d="M15 6h-3.5A4.5 4.5 0 0 0 7 10.5v11A4.5 4.5 0 0 0 11.5 26H15z"/><path d="M17 6h3.5A4.5 4.5 0 0 1 25 10.5v11a4.5 4.5 0 0 1-4.5 4.5H17z"/><circle cx="11" cy="12" r="1.6" fill="#8C8C8C" stroke="none"/><circle cx="21" cy="18.5" r="1.6" fill="#8C8C8C" stroke="none"/></svg>',
 idea:'<svg viewBox="0 0 32 32"><path d="M16 4a9 9 0 0 0-5.4 16.2c.9.7 1.4 1.6 1.4 2.6V24h8v-1.2c0-1 .5-1.9 1.4-2.6A9 9 0 0 0 16 4z" fill="#E2B53E"/><path d="M12.5 26.2h7M13.5 29h5" stroke="#173C32" stroke-width="2.4" stroke-linecap="round"/><path d="M13 12.5a3.5 3.5 0 0 1 3-2.5" stroke="#FFF4D0" stroke-width="2" stroke-linecap="round" fill="none"/></svg>',
 gear:'<svg viewBox="0 0 32 32"><path fill="#8C8C8C" fill-rule="evenodd" d="M13.6 3h4.8l.7 3.3a10 10 0 0 1 2.5 1.4l3.2-1.1 2.4 4.2-2.5 2.2a10 10 0 0 1 0 2.9l2.5 2.2-2.4 4.2-3.2-1.1a10 10 0 0 1-2.5 1.4l-.7 3.3h-4.8l-.7-3.3a10 10 0 0 1-2.5-1.4l-3.2 1.1-2.4-4.2 2.5-2.2a10 10 0 0 1 0-2.9L4.6 10.8 7 6.6l3.2 1.1a10 10 0 0 1 2.5-1.4zM16 11.2a4.8 4.8 0 1 0 0 9.6 4.8 4.8 0 0 0 0-9.6z" transform="translate(0 1)"/></svg>'
};
$$('[data-icon]').forEach(e=>e.innerHTML=IC[e.dataset.icon]);
const DOCK=[
 {id:'events',ic:'online',l:'Eventos',online:true},
 {id:'tasks',ic:'news',l:'Tareas'},
 {id:'shop',ic:'shop',l:'Shopin'},
 {id:'mood',ic:'album',l:'Moods',full:'Moodboards'},
 {id:'sales',ic:'share',l:'JBShare'},
 {id:'newcard',ic:'card',l:'Tarjeta',full:'Tarjeta nueva'},
 {id:'ctrl',ic:'ctrl',l:'Controles'},
 {id:'settings',ic:'gear',l:'Ajustes',full:'Configuración'}
];

/* ---------- sonido tipo consola ---------- */
let actx=null;
function blip(f=880,d=.05){if(!S.meta.settings.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.08,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}

/* ---------- datos ---------- */
const DEF_SET={oz:true,theme:'system',sound:true,taskDot:true,debtDot:true,error:5,target:65,user:'Juan Beltran'};
let S={meta:{restaurants:[],settings:{...DEF_SET}},tasks:{items:[]},events:{items:[]},boards:{items:[]},ideas:{items:[]},r:{}};
let db=null;const timers={};
const lsGet=k=>{try{const v=localStorage.getItem('jbapp_'+k);return v?JSON.parse(v):null}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem('jbapp_'+k,JSON.stringify(v))}catch(e){}};
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
async function readDoc(k){if(db&&db===window.__jbCloud){const v=lsGet(k);if(v!=null)return v}if(db){try{const s=await withTimeout(db.doc('app/'+k).get(),5000);const ex=typeof s?.exists==='function'?s.exists():s?.exists;const d=ex?s.data():null;return d==null?null:JSON.parse(JSON.stringify(d))}catch(e){console.warn('readDoc',k,e);return lsGet(k)}}return lsGet(k)}
const pending={};
function save(k,obj,now=false){clearTimeout(timers[k]);lsSet(k,obj);const run=async()=>{delete pending[k];lsSet(k,obj);if(db){try{await db.doc('app/'+k).set(JSON.parse(JSON.stringify(obj)))}catch(e){toast('No se pudo guardar: '+(e.code||'error'))}}};pending[k]=run;if(now)return run();timers[k]=setTimeout(run,350)}
function flushSaves(){for(const k in pending){clearTimeout(timers[k]);pending[k]()}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSaves()});window.addEventListener('pagehide',flushSaves);
async function delDoc(k){try{localStorage.removeItem('jbapp_'+k)}catch(e){}if(db){try{await db.doc('app/'+k).delete()}catch(e){}}}
const saveMeta=()=>save('meta',S.meta);
const saveR=(id,now)=>{const p=save('r_'+id,S.r[id],now);if(id===socRid())socialSoon();return p};
function fixR(d){
  const R=Object.assign({ingredients:[],recipes:[],categories:[],compras:[],comprasDel:[],sales:[],ledger:[],settings:{error:S.meta.settings.error,target:S.meta.settings.target}},d||{});
  if(R.settings.opex==null)R.settings.opex=0;
  // migración: categorías que antes eran texto
  R.recipes.forEach(r=>{if(r.category&&!r.cat){let c=R.categories.find(x=>norm(x.name)===norm(r.category));if(!c){c={id:uid(),name:r.category};R.categories.push(c)}r.cat=c.id}delete r.category});
  // compras viejas con precio/unidad
  R.compras=R.compras.map(x=>({id:x.id,name:x.name,qty:x.qty||1,img:x.img||null,note:x.note||'',done:!!x.done}));
  return R;
}
async function loadR(id){if(S.r[id])return S.r[id];S.r[id]=fixR(await readDoc('r_'+id));return S.r[id]}
async function loadAllR(){for(const r of S.meta.restaurants)await loadR(r.id)}
const imgCache={};
async function loadImg(id){if(!id)return null;if(imgCache[id])return imgCache[id];const d=await readDoc('img_'+id);imgCache[id]=d?.data||null;return imgCache[id]}
function storeImg(data){const id=uid();imgCache[id]=data;save('img_'+id,{data},true);return id}
function shrink(file,max,type='image/jpeg',q=.8){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL(type,q))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
const tone=r=>r.color||TONES[Math.abs([...r.id].reduce((a,c)=>a+c.charCodeAt(0),0))%TONES.length];
const initials=s=>(s||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const rFace=(r)=>r.logo?`<img src="${r.logo}" alt="">`:esc(initials(r.name));
const restById=id=>S.meta.restaurants.find(r=>r.id===id);

/* ---------- tema ---------- */
function applyTheme(){const t=S.meta.settings.theme;if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}

/* ---------- navegación ---------- */
const stack=[];
function show(id){$$('.screen').forEach(s=>s.hidden=s.id!==id)}
function go(id){const cur=$$('.screen').find(s=>!s.hidden);if(cur&&cur.id!==id)stack.push(cur.id);show(id);blip(660)}
function back(){const p=stack.pop()||'home';show(p);blip(520);const r={home:renderHome,rest:renderRest,mood:renderMood,events:renderEvents,sales:renderSales,ctrl:renderCtrl,shop:renderShop,ideas:renderIdeas}[p];if(r)r()}
$$('[data-back]').forEach(b=>b.onclick=back);

/* ---------- inicio ---------- */
let selIdx=0;
function renderDock(){
  const pendT=taskAlert()&&S.meta.settings.taskDot;
  const debt=S.meta.settings.debtDot&&S.meta.restaurants.some(r=>balance(S.r[r.id])>0);
  $('#dock').innerHTML=DOCK.map(d=>`<button class="rb" data-go="${d.id}" aria-label="${d.full||d.l}"><span class="c ${d.online?'online':''}">${IC[d.ic]}${(d.id==='tasks'&&pendT)||(d.id==='ctrl'&&debt)?'<i class="badge"></i>':''}</span><span class="l">${d.l}</span></button>`).join('');
  $$('#dock [data-go]').forEach(b=>b.onclick=()=>openSection(b.dataset.go));
}
function renderHome(){
  const R=S.meta.restaurants;$('#homeUser').textContent=S.meta.settings.user||'Juan Beltran';
  if(selIdx>=R.length)selIdx=Math.max(0,R.length-1);
  const sh=$('#shelf');
  sh.innerHTML=R.length?R.map((r,i)=>`<button class="tile ${i===selIdx?'sel':''}" data-i="${i}" aria-label="${esc(r.name)}"><span class="art" style="background:${tone(r)}">${r.logo?`<img src="${r.logo}" alt="">`:`<span class="mono" style="font-size:${r.name.length>14?28:r.name.length>8?38:54}px">${esc(r.name)}</span>`}</span></button>`).join(''):`<div class="emptyhome">Toca “Tarjeta nueva” abajo para agregar tu primer restaurante</div>`;
  sh.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{const i=+t.dataset.i;if(i===selIdx){blip(990);openRest(R[i].id)}else{select(i,true)}});
  paintTitle();renderDock();
  requestAnimationFrame(()=>{const t=sh.querySelector(`[data-i="${selIdx}"]`);if(t)sh.scrollTo({left:t.offsetLeft-sh.offsetLeft-parseFloat(getComputedStyle(sh).paddingLeft),behavior:'instant'})});
}
function paintTitle(){const r=S.meta.restaurants[selIdx];$('#gtitle').innerHTML=r?`<span class="ic cardic">${IC.cardS}</span><span>${esc(r.name)}</span>`:''}
let progScroll=0;
function select(i,scroll){selIdx=i;if(scroll)progScroll=Date.now();$$('#shelf .tile').forEach((t,k)=>t.classList.toggle('sel',k===i));paintTitle();blip(820,.035);if(scroll){const sh=$('#shelf'),t=sh.querySelector(`[data-i="${i}"]`);sh.scrollTo({left:t.offsetLeft-sh.offsetLeft-parseFloat(getComputedStyle(sh).paddingLeft),behavior:'smooth'})}}
// deslizar = seleccionar
let scrollT;$('#shelf').addEventListener('scroll',()=>{clearTimeout(scrollT);scrollT=setTimeout(()=>{if(Date.now()-progScroll<900)return;const sh=$('#shelf');const pl=parseFloat(getComputedStyle(sh).paddingLeft);let best=0,bd=1e9;sh.querySelectorAll('.tile').forEach((t,k)=>{const d=Math.abs(t.offsetLeft-sh.offsetLeft-pl-sh.scrollLeft);if(d<bd){bd=d;best=k}});if(best!==selIdx)select(best,false)},90)});
$('#topIdea').onclick=()=>openSection('ideas');
async function openSection(id){
  if(id==='newcard')return openCard();
  if(id==='tasks'){renderTasks();go('tasks')}
  if(id==='shop'){await loadAllR();shopQ='';go('shop');renderShop()}
  if(id==='mood'){moodR=null;go('mood');renderMood()}
  if(id==='events'){await loadAllR();curEv=null;go('events');renderEvents()}
  if(id==='sales'){await loadAllR();saR=null;go('sales');renderSales()}
  if(id==='ctrl'){await loadAllR();ctR=null;go('ctrl');renderCtrl()}
  if(id==='settings'){go('settings');renderSettings()}
  if(id==='ideas'){ideaF='all';go('ideas');renderIdeas()}
}

/* ---------- tarjeta nueva ---------- */
let cardEdit=null,cardLogo=null;
function openCard(r=null){cardEdit=r;cardLogo=r?.logo||null;$('#cardTitle').textContent=r?'Editar tarjeta':'Tarjeta nueva';$('#cName').value=r?.name||'';$('#cLogo').value='';$('#cDelete').hidden=!r;$('#cConfirm').hidden=true;paintFace();$('#cardSheet').hidden=false;blip(700)}
function paintFace(){const f=$('#cardFace');f.innerHTML=cardLogo?`<img src="${cardLogo}" alt="">`:esc(initials($('#cName').value)||'+')}
$('#cName').oninput=paintFace;
$('#cLogo').onchange=async e=>{const f=e.target.files[0];if(!f)return;cardLogo=await shrink(f,360,'image/png');paintFace()};
$('#cCancel').onclick=()=>$('#cardSheet').hidden=true;
$('#cardSheet').onclick=e=>{if(e.target.id==='cardSheet')$('#cardSheet').hidden=true};

const unitCost=i=>{const q=nd(i.pack)*(nd(i.yield||100)/100);return q>0?nd(i.price)/q:0};
const recipeById=(R,id)=>R.recipes.find(r=>r.id===id);

  const base=lines.reduce((a,l)=>a+l.cost,0);const err=nd(rec.error??R.settings.error)/100;const total=base*(1+err);
  const portions=Math.max(nd(rec.portions)||1,1);const per=total/portions;const price=nd(rec.price);

  return{lines,base,err,total,portions,perPortion:per,price,margin,grossMargin,foodCost,opex,opexAmt,net,netTotal:net*portions,contrib:opexAmt,contribTotal:opexAmt*portions,target,suggested:den>0?per/den:0,missing};
}

const lum=h=>{const [r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255);return .299*r+.587*g+.114*b};

  const guests=Math.max(nd(ev.guests),0);const sale=ev.priceMode==='person'?nd(ev.price)*guests:nd(ev.price);
  const profit=sale-total;const margin=sale>0?profit/sale:0;const target=nd(ev.target)/100;const sugg=target<1?total/(1-target):0;
  const byCat=ECAT.map(c=>({c,v:lines.filter(l=>l.cat===c).reduce((a,l)=>a+nd(l.qty)*nd(l.cost),0)})).filter(x=>x.v>0);
  return{base,err,total,guests,sale,profit,margin,perGuest:guests?total/guests:0,salePerGuest:guests?sale/guests:0,sugg,suggPer:guests?sugg/guests:0,byCat};
}

/* reparte cada pago entre los cobros más antiguos */
function allocate(L){const ch=L.filter(m=>m.type!=='pago').map(m=>({m,left:nd(m.amount)}));const pays={};
  const take=(c,rest,parts)=>{const t=Math.min(rest,c.left);if(t>0.5){parts.push({m:c.m,amt:t,full:t>=nd(c.m.amount)-0.5});c.left-=t;return rest-t}return rest};
  for(const p of L.filter(m=>m.type==='pago')){let rest=nd(p.amount);const parts=[];
    if(Array.isArray(p.pays))for(const id of p.pays){const c=ch.find(x=>x.m.id===id);if(c&&rest>0.5)rest=take(c,rest,parts)}
    for(const c of ch){if(rest<=0.5)break;if(c.left>0.5)rest=take(c,rest,parts)}
    pays[p.id]={parts,extra:rest>0.5?rest:0};}

  return{pays,open:ch.filter(c=>c.left>0.5),left}}

async function receipt(R,r,payId,sel){
  const L=R.ledger,{pays,open}=allocate(L);let title,lines,pay=null,num,tot,extraRows=[];
  if(payId){pay=L.find(m=>m.id===payId);const pi=L.filter(m=>m.type==='pago').findIndex(m=>m.id===payId);num=String(pi+1).padStart(4,'0');
    const parts=pays[payId]?.parts||[];const rows=[];
    for(const p of parts){const m=p.m;const q=m.qty||1,u=m.unit||nd(m.amount)/q;if(p.amt>=nd(m.amount)-0.5){for(let k=0;k<q;k++)rows.push({name:prodName(m)+(m.date?` (${fdr(m)})`:''),unit:u})}else rows.push({name:'Abono a '+prodName(m)+(m.date?` (${fdr(m)})`:''),unit:p.amt})}
    lines=groupLines(rows);if(pays[payId]?.extra>0.5)lines.push({name:'Saldo a favor',qty:1,unit:pays[payId].extra,total:pays[payId].extra});
    title='RECIBO DE PAGO';tot=nd(pay.amount);
    const idx=L.indexOf(pay);const before=L.slice(0,idx+1);const due=before.reduce((a,m)=>a+(m.type==='pago'?-nd(m.amount):nd(m.amount)),0);
    extraRows=[['Método de pago',PM[pay.method]||'—'],['Saldo pendiente',money(Math.max(0,due))]];
  }else{const rows=[];for(const c of open.filter(c=>!sel||sel.includes(c.m.id))){const m=c.m;const q=m.qty||1,u=m.unit||nd(m.amount)/q;if(c.left>=nd(m.amount)-0.5){for(let k=0;k<q;k++)rows.push({name:prodName(m)+(m.date?` (${fdr(m)})`:''),unit:u})}else rows.push({name:'Saldo de '+prodName(m)+(m.date?` (${fdr(m)})`:''),unit:c.left})}
    lines=groupLines(rows);if(!lines.length)return toast(`${r.name} está al día`);title='CUENTA DE COBRO';num=String((R.billN=(R.billN||0)+1)).padStart(4,'0');saveR(ctR);tot=lines.reduce((a,l)=>a+l.total,0);extraRows=[['Estado','Pendiente de pago']];}
  // dibujo
  const W=384,k=2,font=getComputedStyle(document.body).fontFamily;const mono=`"Courier New",ui-monospace,monospace`;
  const cv=document.createElement('canvas');const g0=cv.getContext('2d');
  const lineH=20;const wrap=(g,t,w)=>{const out=[];let cur='';for(const word of t.split(' ')){const tt=cur?cur+' '+word:word;if(g.measureText(tt).width>w&&cur){out.push(cur);cur=word}else cur=tt}out.push(cur);return out};
  g0.font=`13px ${mono}`;const itemH=lines.reduce((a,l)=>a+wrap(g0,l.name,W-40).length*lineH+lineH+6,0);
  const H=360+itemH+extraRows.length*lineH+90;cv.width=W*k;cv.height=H*k;const g=cv.getContext('2d');g.scale(k,k);g.fillStyle='#fff';g.fillRect(0,0,W,H);
  const logoSvg=$('#splash .lg svg')?.outerHTML||document.querySelector('.av svg').outerHTML;
  const lg=new Image();lg.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(logoSvg.replace('<svg','<svg width="440" height="231" style="color:#173C32"').replace(/currentColor/g,'#173C32'));
  await new Promise(res=>{lg.onload=res;lg.onerror=res;setTimeout(res,1500)});
  let y=24;try{g.drawImage(lg,W/2-80,y,160,84)}catch(e){}y+=100;
  const c=(t,f,col='#111')=>{g.font=f;g.fillStyle=col;g.textAlign='center';g.fillText(t,W/2,y);y+=lineH};
  g.textBaseline='alphabetic';c('Servicios gastronómicos',`13px ${mono}`,'#444');
  const dash=()=>{g.strokeStyle='#999';g.setLineDash([4,3]);g.beginPath();g.moveTo(16,y-8);g.lineTo(W-16,y-8);g.stroke();g.setLineDash([]);y+=10};
  dash();c(title,`800 17px ${font}`,'#173C32');c('N° '+num,`13px ${mono}`);dash();
  const lr=(a,b,bold)=>{g.font=`${bold?'700 ':''}13px ${mono}`;g.fillStyle='#111';g.textAlign='left';g.fillText(a,20,y);g.textAlign='right';g.fillText(b,W-20,y);y+=lineH};
  lr('Fecha',fdate(pay?.date||today()));lr('Cliente','');g.font=`700 14px ${font}`;g.textAlign='left';g.fillText(r.name,20,y);y+=lineH+4;dash();
  g.font=`700 12px ${mono}`;g.textAlign='left';g.fillText('PRODUCTO',20,y);g.textAlign='right';g.fillText('TOTAL',W-20,y);y+=lineH;
  for(const l of lines){g.font=`13px ${mono}`;g.fillStyle='#111';g.textAlign='left';for(const t of wrap(g,l.name,W-40)){g.fillText(t,20,y);y+=lineH}
    g.fillStyle='#555';g.fillText(`${l.qty} x ${money(l.unit)}`,28,y);g.fillStyle='#111';g.textAlign='right';g.fillText(money(l.total),W-20,y);y+=lineH+6}
  dash();g.font=`800 16px ${font}`;g.textAlign='left';g.fillStyle='#173C32';g.fillText(pay?'TOTAL PAGADO':'TOTAL A PAGAR',20,y);g.textAlign='right';g.fillText(money(tot),W-20,y);y+=lineH+8;
  for(const [a,b] of extraRows)lr(a,b);dash();
  c('¡Gracias!',`700 14px ${font}`,'#173C32');c('Juan Beltran',`12px ${mono}`,'#666');y+=4;c('Documento interno de soporte. No es factura electrónica.',`10px ${mono}`,'#888');

}

  let cat=R.categories.find(c=>norm(c.name)==='subrecetas');if(!cat){cat={id:'eidc2guq',name:'Subrecetas'};R.categories.push(cat);changed=true}

}
/* ---------- puente con SOCIAL APP (app del capitán de compras de Social) ----------
   Lo pendiente en Shopin para Social le aparece al capitán en CARGA como una solicitud "Juan Beltran · Shopin".
   Lo que el capitán marca como comprado se marca solo en Shopin. Usa ids con prefijo "jb-" para no chocar
   con otras apps (la de Jeanca usa "jk-"). */
const SOCIAL_APP='https://script.google.com/macros/s/AKfycbzvw8TvV-YjhiMt2n1akTVIOjz1z7Cdz-QzY8gDkEnF-IRFs9AOmyVAtGVVl3Wyey2c/exec';
function socRid(){const r=(S.meta.restaurants||[]).find(r=>r.id==='social')||(S.meta.restaurants||[]).find(r=>/social/i.test(r.name||''));return r?r.id:null}
let socT=null,socBusy=false,socAgain=false;
function socialSoon(){clearTimeout(socT);socT=setTimeout(socialSync,1500)}
const socQty=x=>String(x.qty||1)+(x.note?' · '+x.note:'');
async function socialSync(){
  const rid=socRid();if(!rid||!S.r[rid])return;if(!window.claude&&!(CL.ses&&CL.since))return; // solo con la nube al día
  if(socBusy){socAgain=true;return}socBusy=true;
  try{
    const st=await (await fetch(SOCIAL_APP,{cache:'no-store'})).json();
    const R=S.r[rid];R.compras=R.compras||[];
    const mine=(st.reqs||[]).filter(r=>String(r.id).startsWith('jb-'));
    // 1) lo que el capitán compró se marca en Shopin (una sola vez por producto)
    let seen=[];try{seen=JSON.parse(localStorage.getItem('jb_soc_seen')||'[]')}catch(e){}
    const seenS=new Set(seen);let mark=false;
    mine.forEach(r=>(r.items||[]).forEach(it=>{if(it.status==='bought'&&!seenS.has(it.id)){seenS.add(it.id);const x=R.compras.find(c=>'jb-'+c.id===it.id);if(x&&!x.done){x.done=true;mark=true}}}));
    try{localStorage.setItem('jb_soc_seen',JSON.stringify([...seenS].slice(-500)))}catch(e){}
    if(mark){save('r_'+rid,R);try{if(!$('#shop').hidden)renderShop()}catch(e){}toast('El capitán compró cosas de tu Shopin')}
    // 2) lo pendiente de Shopin va a la carga abierta del capitán
    let open=mine.find(r=>!r.sent);const cur=open?open.items||[]:[];const items=[];
    const del=new Set((R.comprasDel||[]).map(id=>'jb-'+id));const inAny=new Set(mine.flatMap(r=>(r.items||[]).map(i=>i.id)));
    cur.forEach(it=>{const x=R.compras.find(c=>'jb-'+c.id===it.id);
      if(it.status!=='pending')items.push(it);                         // ya lo marcó el capitán: se respeta
      else if(x&&x.done)items.push({...it,status:'bought'});          // tú lo marcaste comprado
      else if(x)items.push({...it,name:x.name,qty:socQty(x)});        // sigue pendiente (con cambios)
      else if(!del.has(it.id))items.push(it);                         // este aparato no lo conoce: se deja quieto
    });
    R.compras.filter(x=>!x.done&&!items.some(it=>it.id==='jb-'+x.id)&&!inAny.has('jb-'+x.id)).forEach(x=>items.push({id:'jb-'+x.id,zone:'Shopin',name:x.name,qty:socQty(x),status:'pending'}));
    if(open&&JSON.stringify(cur)===JSON.stringify(items))return;
    if(!open&&!items.length)return;
    const body={del:{},reqs:[]};
    if(open&&!items.length&&cur.every(it=>del.has(it.id)))body.del[open.id]=Date.now();else if(open&&!items.length)return;
    else{if(!open)open={id:'jb-'+Date.now().toString(36),from:(S.meta.settings.user||'Juan Beltran')+' · Shopin',date:new Date().toISOString(),sent:false,note:'',memo:'Enviado desde la app de Juan Beltran'};
      body.reqs.push({...open,items,u:Date.now()})}
    await fetch(SOCIAL_APP,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({state:body})});
  }catch(e){console.warn('social',e)}
  finally{socBusy=false;if(socAgain){socAgain=false;socialSoon()}}
}
