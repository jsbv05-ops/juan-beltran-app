<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Juan Beltran App</title>
<meta name="theme-color" content="#173C32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Juan Beltran">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>html,body{margin:0;padding:0}</style>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: inicio de consola — barra superior (perfil + hora), título del juego seleccionado, fila de tarjetas grandes, dock de botones redondos; cada botón abre una pantalla completa */
:root{
  --bg:#EBEBEB; --panel:#FFFFFF; --panel-2:#F3F3F3; --fg:#2D2D2D; --muted:#808080; --line:#D6D6D6;
  --sel:#14C8E6; --sel-2:#0AB1E0;
  --news:#3DBE6E; --shop:#F0502A; --album:#3C8DF0; --online:#E60012; --share:#19C2B4; --grey:#7A7A7A;
  --verde:#173C32; --hueso:#F3EBDD; --dot:#1E90FF;
  --good:#1E9E5A; --warn:#D08A00; --bad:#D9372A;
  --pole:#E0A200; --podio:#2F7FE0; --rookie:#8E44D6; --box:#8A8A8A;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Arial Rounded MT Bold",system-ui,sans-serif;
  --shadow:0 1px 0 rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2D2D2D;--panel:#464646;--panel-2:#3A3A3A;--fg:#F2F2F2;--muted:#A6A6A6;--line:#555555;--shadow:0 1px 0 rgba(0,0,0,.2),0 6px 18px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2D2D2D;--panel:#464646;--panel-2:#3A3A3A;--fg:#F2F2F2;--muted:#A6A6A6;--line:#555555;--shadow:0 1px 0 rgba(0,0,0,.2),0 6px 18px rgba(0,0,0,.35);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%}
input,select,textarea{max-width:100%;min-width:0}
input[type=date].in{-webkit-appearance:none;appearance:none;min-height:40px;display:block}
@media(max-width:640px){.in{font-size:16px}}
.field>*{min-width:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* arranque */
#splash{position:fixed;inset:0;z-index:100;background:#0E0E0C;overflow:hidden;transition:opacity .6s;--b:.07;--g:0}
#splash.out{opacity:0;pointer-events:none}
#splash .stage{position:absolute;left:50%;top:50%;width:max(100vw,calc(100vh * 0.5629));aspect-ratio:577/1025;transform:translate(-50%,-50%)}
#splash .lamp{position:absolute;inset:0;width:100%;height:100%;filter:brightness(var(--b));transition:filter .25s}
#splash .glow{position:absolute;left:10%;right:10%;top:36%;height:45%;background:radial-gradient(50% 50% at 50% 20%,rgba(255,236,200,.22),transparent 70%);opacity:var(--g);pointer-events:none;transition:opacity .3s}
#splash .lg{position:absolute;left:29.2%;top:71.3%;width:39.9%;color:#F3EBDD;opacity:0;transform:translateY(6px);transition:opacity .8s ease,transform .8s ease}
#splash .lg svg{width:100%;height:auto;display:block}
#splash.lit .lg{opacity:1;transform:none}
#splash.on .lamp{animation:lampOn 1.1s steps(1,end) forwards}
@keyframes lampOn{0%{filter:brightness(.6)}12%{filter:brightness(.1)}22%{filter:brightness(.8)}30%{filter:brightness(.15)}42%{filter:brightness(.95)}50%{filter:brightness(.4)}60%,100%{filter:brightness(1)}}
#splash.on .glow{opacity:1;transition-delay:.65s}
#splash .msg{position:absolute;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));font-size:12px;color:rgba(243,235,221,.5);text-align:center}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.screen[hidden]{display:none!important}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* inicio */
.top{display:flex;align-items:center;justify-content:space-between;padding-block:14px 4px}
.me{display:flex;align-items:center;gap:10px}
.av{width:44px;height:44px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;box-shadow:var(--shadow);border:3px solid var(--panel)}
.av svg{width:28px}
.me b{font-weight:800;font-size:15px}
.topidea{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;transition:transform .12s,box-shadow .12s}
.topidea span{width:28px;height:28px;display:block}.topidea svg{width:100%;height:100%}
.topidea:hover,.topidea:focus-visible{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--sel)}.topidea:active{transform:scale(.92)}
.home-mid{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.gtitle{display:flex;align-items:center;gap:8px;min-height:30px;font-weight:700;font-size:17px;padding-bottom:10px}
.gtitle .ic{width:22px;height:22px;border-radius:4px;overflow:hidden;flex:0 0 auto;display:grid;place-items:center;font-size:10px;color:#fff;font-weight:800}
.gtitle .ic.cardic{color:var(--fg);border-radius:0}.gtitle .ic.cardic svg{width:22px;height:22px}
.gtitle .ic img{width:100%;height:100%;object-fit:cover}
.gtitle span{min-width:0;overflow-wrap:anywhere}
.row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-block:8px 18px;scrollbar-width:none;scroll-padding-left:max(16px,env(safe-area-inset-left,0px))}
.row::-webkit-scrollbar{display:none}
.row::after{content:"";flex:0 0 max(40vw,calc(100vw - min(58vw,280px) - 60px))}
.tile{flex:0 0 auto;width:min(58vw,280px);aspect-ratio:1;border-radius:4px;background:var(--panel);box-shadow:var(--shadow);scroll-snap-align:start;position:relative;transition:transform .15s}
.tile .art{position:absolute;inset:0;border-radius:4px;overflow:hidden;display:grid;place-items:center}
.tile .art img{width:100%;height:100%;object-fit:cover}
.tile .mono{font-weight:800;color:#fff;text-align:center;padding:14px;line-height:1.02;letter-spacing:-.01em;overflow-wrap:anywhere}
.tile.sel{box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--sel);animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--sel-2)}}
.emptyhome{width:min(58vw,280px);aspect-ratio:1;border-radius:4px;border:3px dashed var(--line);display:grid;place-items:center;text-align:center;color:var(--muted);padding:20px;font-weight:700;flex:0 0 auto}
.dock{display:flex;justify-content:safe center;gap:12px;padding-block:12px 12px;overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.rb{display:flex;flex-direction:column;align-items:center;gap:5px;flex:0 0 auto;width:58px}
.rb .c{width:52px;height:52px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;position:relative;transition:transform .12s,box-shadow .12s}
.rb:hover .c,.rb:focus-visible .c{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--sel)}
.rb:active .c{transform:scale(.92)}
.rb .c svg{width:28px;height:28px}
.rb span.l{font-size:10px;font-weight:700;color:var(--muted);text-align:center;line-height:1.1;white-space:nowrap}
@media(max-width:560px){.dock{gap:0;justify-content:space-between}.rb{width:auto;flex:1 1 0;min-width:0}.rb .c{width:min(44px,10.6vw);height:min(44px,10.6vw)}.rb .c svg{width:62%;height:62%}.rb span.l{font-size:8px;max-width:100%;overflow:hidden;text-overflow:ellipsis}.badge{width:11px;height:11px}}
.rb .c{background:#FFFFFF!important}.rb .c.online{background:#173C32!important}
.badge{position:absolute;top:1px;right:1px;width:13px;height:13px;border-radius:50%;background:var(--dot);border:2px solid var(--bg)}
.foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-block:8px 6px;font-size:12px;color:var(--muted);margin-inline:max(16px,env(safe-area-inset-left,0px))}
.kbd{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:10px;font-weight:800;margin-right:4px}

/* encabezados */
.hd{display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);background:var(--bg)}
.back{width:40px;height:40px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;flex:0 0 auto;color:var(--fg)}
.back svg{width:20px}
.hd h1{font-size:19px;font-weight:800;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .hico{width:34px;height:34px;flex:0 0 auto}
#events .hico{background:#173C32;border-radius:50%;padding:4px;box-sizing:border-box}
.hd .logo{width:40px;height:40px;border-radius:6px;overflow:hidden;flex:0 0 auto;display:grid;place-items:center;font-weight:800;color:#fff}
.hd .logo img{width:100%;height:100%;object-fit:cover}
.body{flex:1;overflow-y:auto;padding-block:14px 40px;-webkit-overflow-scrolling:touch;min-height:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:999px;background:var(--panel);font-weight:700;font-size:13.5px;white-space:nowrap;box-shadow:var(--shadow)}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.wrapmax{max-width:860px;margin:0 auto}

/* controles */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:999px;font-weight:800;background:var(--fg);color:var(--bg);font-size:14px}
.btn.ghost{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}
.btn.danger{background:var(--bad);color:#fff}
.btn.accent{background:var(--sel-2);color:#fff}
.btn.sm{padding:6px 12px;font-size:12.5px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lab{font-size:12px;font-weight:700;color:var(--muted)}
.in{width:100%;padding:9px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);min-width:0}
.in:focus{border-color:var(--sel);outline:none}
textarea.in{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:440px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.span2{grid-column:span 2}
.card{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.rowx{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.empty{padding:26px 12px;text-align:center;color:var(--muted)}
.chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800;color:#fff;white-space:nowrap}
.chip.good{background:var(--good)}.chip.warn{background:var(--warn)}.chip.bad{background:var(--bad)}
.chip.pole{background:var(--pole)}.chip.podio{background:var(--podio)}.chip.rookie{background:var(--rookie)}.chip.box{background:var(--box)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:13.5px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.ex{font-size:11px;font-weight:800;color:var(--warn);text-transform:uppercase;letter-spacing:.06em}
.x{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
.x:hover{background:var(--panel-2)}
.sec{font-size:17px;font-weight:800;margin:0}

/* listas tipo tarjeta */
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.rc{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left}
.rc h3{margin:0;font-size:16px;font-weight:800}
.k3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.k3 div{background:var(--panel-2);border-radius:10px;padding:7px 8px;min-width:0}
.k3 small{display:block;font-size:10.5px;color:var(--muted);font-weight:700}
.k3 b{font-size:14px}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:13.5px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:11.5px;color:var(--muted);font-weight:800;background:var(--panel-2)}
td:first-child,th:first-child{text-align:left}
td .in{padding:6px 8px;border-radius:8px}
.w-name{min-width:150px}
.bar-p{height:6px;border-radius:3px;background:var(--panel-2);margin-top:3px;overflow:hidden}
.bar-p i{display:block;height:100%;background:var(--sel)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.kpi{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:12px;min-width:0}
.kpi small{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.kpi b{font-size:20px;font-weight:800}
.kpi.hl{background:#173C32;color:#F3EBDD}.kpi.hl small{color:rgba(243,235,221,.75)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.pk{display:flex;flex-direction:column;gap:6px;text-align:left}
.pk .sq{aspect-ratio:1;border-radius:4px;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;box-shadow:var(--shadow);text-align:center;padding:6px;position:relative}
.pk .sq img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.pk b{font-size:13.5px;font-weight:700}
.pk small{color:var(--muted);font-size:12px}

/* tienda (compras) */
.shop{--shop:#B8913A}
.shop .hd{background:#173C32;color:#F3EBDD;border:0;box-shadow:inset 0 -3px 0 #B8913A}
.shop .hd h1{letter-spacing:.01em}
.shop .side button[aria-current="true"]{color:#173C32;border-left-color:#B8913A;background:rgba(184,145,58,.12)}
:root[data-theme="dark"] .shop .side button[aria-current="true"]{color:#E3C77E}
.carou{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:10px}
.carou::-webkit-scrollbar{display:none}
.carou .hero{flex:0 0 100%;scroll-snap-align:start;min-height:190px}
.hero .tagn{align-self:flex-start;background:#B8913A;color:#173C32;font-weight:800;font-size:10.5px;letter-spacing:.1em;padding:3px 8px;border-radius:4px}
.hero .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(23,60,50,.55),transparent 55%)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:-6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:#B8913A;width:18px;border-radius:4px}
.secbar{display:flex;align-items:baseline;gap:8px}
.secbar .more{margin-left:auto;font-weight:800;font-size:13px;color:#B8913A}
.hrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;scroll-snap-type:x proximity}
.hrow::-webkit-scrollbar{display:none}
.hrow .gt{flex:0 0 136px;scroll-snap-align:start}
.shop .fab{background:#173C32;color:#F3EBDD;box-shadow:0 0 0 3px #B8913A,0 8px 20px rgba(23,60,50,.4)}
.shop-tag{display:inline-block;font-size:11px;font-weight:800;color:#B8913A;letter-spacing:.06em;text-transform:uppercase}
.shopwrap{flex:1;display:flex;min-height:0}
.side{width:200px;flex:0 0 auto;border-right:1px solid var(--line);overflow-y:auto;padding-block:10px;background:var(--panel-2)}
.side button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;text-align:left;font-weight:700;border-left:4px solid transparent}
.side button[aria-current="true"]{border-left-color:var(--shop);background:var(--panel);color:var(--shop)}
.side .lg{width:30px;height:30px;border-radius:4px;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px;flex:0 0 auto}
.side .lg img{width:100%;height:100%;object-fit:cover}
.sitems{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.si{background:var(--panel);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.si .pic{aspect-ratio:1;display:grid;place-items:center;font-weight:800;font-size:28px;color:#fff;position:relative;overflow:hidden}
.si .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.si .pic .qty{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);padding:2px 9px;border-radius:999px;font-size:12.5px;color:#fff}
.si .meta{padding:9px 10px;display:flex;flex-direction:column;gap:6px}
.si .meta b{font-size:14px;overflow-wrap:anywhere}
.si.done{opacity:.5}.si.done .meta b{text-decoration:line-through}
@media(max-width:640px){.shopwrap,.splitwrap{flex-direction:column}.side{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}.side button{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;border-radius:8px}.side button[aria-current="true"]{border-bottom-color:var(--shop)}}


.shop .back{background:rgba(255,255,255,.18);color:#fff;box-shadow:none}
.shop .side{background:var(--panel)}
.shop .side .ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);flex:0 0 auto}
.eq{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:999px;box-shadow:var(--shadow);padding:4px 6px 4px 14px}
.eq input{border:0;background:none;flex:1;min-width:0;padding:8px 0;outline:none}
.hero{position:relative;border-radius:10px;overflow:hidden;min-height:180px;display:flex;align-items:flex-end;color:#fff;box-shadow:var(--shadow);text-align:left;width:100%}
.hero .bg{position:absolute;inset:0;display:grid;place-items:center;font-size:96px;font-weight:800;color:rgba(255,255,255,.22)}
.hero .bg img{width:100%;height:100%;object-fit:cover}
.hero .cap{position:relative;width:100%;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.75));display:flex;flex-direction:column;gap:4px}
.hero .cap small{font-weight:800;letter-spacing:.08em;font-size:11px;opacity:.85}
.hero .cap b{font-size:22px;font-weight:800}
.shelf2{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px 12px}
.gt{display:flex;flex-direction:column;gap:6px;text-align:left}
.gt .art{aspect-ratio:1;border-radius:6px;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:800;font-size:30px;box-shadow:var(--shadow);position:relative}
.gt .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gt b{font-size:13.5px;font-weight:700;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gt .pr{font-size:13px;font-weight:800;color:var(--shop)}
.gt.done{opacity:.55}
.gt.done .pr{color:var(--good)}

<script>

const COP=new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});

const pct=v=>(isFinite(v)?(v*100).toFixed(1):'0.0')+'%';
const n=v=>{const x=parseFloat(String(v??'').replace(/\./g,'').replace(',','.'));return isFinite(x)?x:0};
const pm=v=>{let t=String(v??'').replace(/[^0-9.,-]/g,'');if(!t)return 0;if(t.includes('.')&&t.includes(',')){t=t.lastIndexOf(',')>t.lastIndexOf('.')?t.replace(/\./g,'').replace(',','.'):t.replace(/,/g,'')}else if(/^-?\d{1,3}([.,]\d{3})+$/.test(t))t=t.replace(/[.,]/g,'');else t=t.replace(',','.');const x=parseFloat(t);return isFinite(x)?x:0};
const nd=v=>{const x=parseFloat(String(v??'').replace(',','.'));return isFinite(x)?x:0};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const TONES=['#1F1F1F','#C8402F','#173C32','#2F6FD6','#7A4BC2','#B8860B','#E8641E','#1E8E5A'];
const UNITS=['g','ml','und','kg','L','oz'];
const today=()=>new Date().toISOString().slice(0,10);
const fdate=d=>d?new Date(d+'T12:00').toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'}):'';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2300)}
const BACK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';

 shop:'<svg viewBox="0 0 32 32" fill="none" stroke="#C08A2E" stroke-width="2.8" stroke-linejoin="round"><path d="M6 11h20l-1.6 15H7.6z"/><path d="M11.5 11V9a4.5 4.5 0 0 1 9 0v2" stroke-linecap="round"/></svg>',
 shopW:'<svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.8" stroke-linejoin="round"><path d="M6 11h20l-1.6 15H7.6z"/><path d="M11.5 11V9a4.5 4.5 0 0 1 9 0v2" stroke-linecap="round"/></svg>',
 album:'<svg viewBox="0 0 32 32"><rect x="4" y="7" width="24" height="18" rx="3" fill="none" stroke="#2E7D5B" stroke-width="2.8"/><circle cx="11" cy="13" r="2.2" fill="#C08A2E"/><path d="M8 22l6-7 4 4 3-3 4 6z" fill="#2E7D5B"/></svg>',

 share:'<svg viewBox="0 0 32 32" fill="none" stroke="#2C6E63" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"><path d="M5 17v8h22v-8"/><path d="M5 17h6l2 3h6l2-3h6"/><path d="M10 12h12M12 8h8"/></svg>',

 gear:'<svg viewBox="0 0 32 32"><path fill="#8C8C8C" fill-rule="evenodd" d="M13.6 3h4.8l.7 3.3a10 10 0 0 1 2.5 1.4l3.2-1.1 2.4 4.2-2.5 2.2a10 10 0 0 1 0 2.9l2.5 2.2-2.4 4.2-3.2-1.1a10 10 0 0 1-2.5 1.4l-.7 3.3h-4.8l-.7-3.3a10 10 0 0 1-2.5-1.4l-3.2 1.1-2.4-4.2 2.5-2.2a10 10 0 0 1 0-2.9L4.6 10.8 7 6.6l3.2 1.1a10 10 0 0 1 2.5-1.4zM16 11.2a4.8 4.8 0 1 0 0 9.6 4.8 4.8 0 0 0 0-9.6z" transform="translate(0 1)"/></svg>'
};
$$('[data-icon]').forEach(e=>e.innerHTML=IC[e.dataset.icon]);
const DOCK=[
 {id:'events',ic:'online',l:'Eventos',online:true},
 {id:'tasks',ic:'news',l:'Tareas'},
 {id:'shop',ic:'shop',l:'Shopin'},
 {id:'mood',ic:'album',l:'Moods',full:'Moodboards'},
 {id:'sales',ic:'share',l:'JBShare'},
 {id:'newcard',ic:'card',l:'Tarjeta',full:'Tarjeta nueva'},

/* ---------- sonido tipo consola ---------- */
let actx=null;
function blip(f=880,d=.05){if(!S.meta.settings.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.08,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}

/* ---------- datos ---------- */
const DEF_SET={oz:true,theme:'system',sound:true,taskDot:true,debtDot:true,error:5,target:65,user:'Juan Beltran'};
let S={meta:{restaurants:[],settings:{...DEF_SET}},tasks:{items:[]},events:{items:[]},boards:{items:[]},ideas:{items:[]},r:{}};
let db=null;const timers={};
const lsGet=k=>{try{const v=localStorage.getItem('jbapp_'+k);return v?JSON.parse(v):null}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem('jbapp_'+k,JSON.stringify(v))}catch(e){}};
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
async function readDoc(k){if(db){try{const s=await withTimeout(db.doc('app/'+k).get(),5000);const ex=typeof s?.exists==='function'?s.exists():s?.exists;const d=ex?s.data():null;return d==null?null:JSON.parse(JSON.stringify(d))}catch(e){console.warn('readDoc',k,e);return lsGet(k)}}return lsGet(k)}
const pending={};
function save(k,obj,now=false){clearTimeout(timers[k]);lsSet(k,obj);const run=async()=>{delete pending[k];lsSet(k,obj);if(db){try{await db.doc('app/'+k).set(JSON.parse(JSON.stringify(obj)))}catch(e){toast('No se pudo guardar: '+(e.code||'error'))}}};pending[k]=run;if(now)return run();timers[k]=setTimeout(run,350)}
function flushSaves(){for(const k in pending){clearTimeout(timers[k]);pending[k]()}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSaves()});window.addEventListener('pagehide',flushSaves);
async function delDoc(k){try{localStorage.removeItem('jbapp_'+k)}catch(e){}if(db){try{await db.doc('app/'+k).delete()}catch(e){}}}
const saveMeta=()=>save('meta',S.meta);
const saveR=id=>save('r_'+id,S.r[id]);
function fixR(d){
  const R=Object.assign({ingredients:[],recipes:[],categories:[],compras:[],sales:[],ledger:[],settings:{error:S.meta.settings.error,target:S.meta.settings.target}},d||{});
  if(R.settings.opex==null)R.settings.opex=0;
  // migración: categorías que antes eran texto
  R.recipes.forEach(r=>{if(r.category&&!r.cat){let c=R.categories.find(x=>norm(x.name)===norm(r.category));if(!c){c={id:uid(),name:r.category};R.categories.push(c)}r.cat=c.id}delete r.category});
  // compras viejas con precio/unidad
  R.compras=R.compras.map(x=>({id:x.id,name:x.name,qty:x.qty||1,img:x.img||null,note:x.note||'',done:!!x.done}));
  return R;
}
async function loadR(id){if(S.r[id])return S.r[id];S.r[id]=fixR(await readDoc('r_'+id));return S.r[id]}
async function loadAllR(){for(const r of S.meta.restaurants)await loadR(r.id)}
const imgCache={};
async function loadImg(id){if(!id)return null;if(imgCache[id])return imgCache[id];const d=await readDoc('img_'+id);imgCache[id]=d?.data||null;return imgCache[id]}
function storeImg(data){const id=uid();imgCache[id]=data;save('img_'+id,{data},true);return id}
function shrink(file,max,type='image/jpeg',q=.8){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL(type,q))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
const tone=r=>r.color||TONES[Math.abs([...r.id].reduce((a,c)=>a+c.charCodeAt(0),0))%TONES.length];
const initials=s=>(s||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const rFace=(r)=>r.logo?`<img src="${r.logo}" alt="">`:esc(initials(r.name));
const restById=id=>S.meta.restaurants.find(r=>r.id===id);

/* ---------- tema ---------- */
function applyTheme(){const t=S.meta.settings.theme;if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}

/* ---------- navegación ---------- */
const stack=[];
function show(id){$$('.screen').forEach(s=>s.hidden=s.id!==id)}
function go(id){const cur=$$('.screen').find(s=>!s.hidden);if(cur&&cur.id!==id)stack.push(cur.id);show(id);blip(660)}
function back(){const p=stack.pop()||'home';show(p);blip(520);const r={home:renderHome,rest:renderRest,mood:renderMood,events:renderEvents,sales:renderSales,ctrl:renderCtrl,shop:renderShop,ideas:renderIdeas}[p];if(r)r()}
$$('[data-back]').forEach(b=>b.onclick=back);

/* ---------- inicio ---------- */
let selIdx=0;
function renderDock(){
  const pendT=taskAlert()&&S.meta.settings.taskDot;
  const debt=S.meta.settings.debtDot&&S.meta.restaurants.some(r=>balance(S.r[r.id])>0);
  $('#dock').innerHTML=DOCK.map(d=>`<button class="rb" data-go="${d.id}" aria-label="${d.full||d.l}"><span class="c ${d.online?'online':''}">${IC[d.ic]}${(d.id==='tasks'&&pendT)||(d.id==='ctrl'&&debt)?'<i class="badge"></i>':''}</span><span class="l">${d.l}</span></button>`).join('');
  $$('#dock [data-go]').forEach(b=>b.onclick=()=>openSection(b.dataset.go));
}
function renderHome(){
  const R=S.meta.restaurants;$('#homeUser').textContent=S.meta.settings.user||'Juan Beltran';
  if(selIdx>=R.length)selIdx=Math.max(0,R.length-1);
  const sh=$('#shelf');
  sh.innerHTML=R.length?R.map((r,i)=>`<button class="tile ${i===selIdx?'sel':''}" data-i="${i}" aria-label="${esc(r.name)}"><span class="art" style="background:${tone(r)}">${r.logo?`<img src="${r.logo}" alt="">`:`<span class="mono" style="font-size:${r.name.length>14?28:r.name.length>8?38:54}px">${esc(r.name)}</span>`}</span></button>`).join(''):`<div class="emptyhome">Toca “Tarjeta nueva” abajo para agregar tu primer restaurante</div>`;
  sh.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{const i=+t.dataset.i;if(i===selIdx){blip(990);openRest(R[i].id)}else{select(i,true)}});

let progScroll=0;
function select(i,scroll){selIdx=i;if(scroll)progScroll=Date.now();$$('#shelf .tile').forEach((t,k)=>t.classList.toggle('sel',k===i));paintTitle();blip(820,.035);if(scroll){const sh=$('#shelf'),t=sh.querySelector(`[data-i="${i}"]`);sh.scrollTo({left:t.offsetLeft-sh.offsetLeft-parseFloat(getComputedStyle(sh).paddingLeft),behavior:'smooth'})}}
// deslizar = seleccionar
let scrollT;$('#shelf').addEventListener('scroll',()=>{clearTimeout(scrollT);scrollT=setTimeout(()=>{if(Date.now()-progScroll<900)return;const sh=$('#shelf');const pl=parseFloat(getComputedStyle(sh).paddingLeft);let best=0,bd=1e9;sh.querySelectorAll('.tile').forEach((t,k)=>{const d=Math.abs(t.offsetLeft-sh.offsetLeft-pl-sh.scrollLeft);if(d<bd){bd=d;best=k}});if(best!==selIdx)select(best,false)},90)});

/* ---------- costos de recetas ---------- */
const unitCost=i=>{const q=nd(i.pack)*(nd(i.yield||100)/100);return q>0?nd(i.price)/q:0};
function calc(rec,R){
  const ings=Object.fromEntries(R.ingredients.map(i=>[i.id,i]));
  const lines=(rec.items||[]).map(it=>{const ing=ings[it.ing];const uc=ing?unitCost(ing):0;return{it,ing,uc,cost:uc*nd(it.qty)}});
  const base=lines.reduce((a,l)=>a+l.cost,0);const err=nd(rec.error??R.settings.error)/100;const total=base*(1+err);
  const portions=Math.max(nd(rec.portions)||1,1);const per=total/portions;const price=nd(rec.price);
  const target=nd(rec.target??R.settings.target)/100;const opex=nd(rec.opex??R.settings.opex??0)/100;const opexAmt=price*opex;
  const gross=price-per;const net=gross-opexAmt;const margin=price>0?net/price:0;const grossMargin=price>0?gross/price:0;const foodCost=price>0?per/price:0;
  lines.forEach(l=>l.share=base>0?l.cost/base:0);
  const missing=lines.filter(l=>!l.ing||!(nd(l.ing.price)>0)).map(l=>l.ing?.name||'Ingrediente eliminado');
  const den=1-target-opex;
  return{lines,base,err,total,portions,perPortion:per,price,margin,grossMargin,foodCost,opex,opexAmt,net,netTotal:net*portions,contrib:opexAmt,contribTotal:opexAmt*portions,target,suggested:den>0?per/den:0,missing};
}
const OZ=30;const isOz=ing=>ing&&ing.unit==='ml'&&S.meta.settings.oz!==false;const qShow=(ing,q)=>isOz(ing)?+(nd(q)/OZ).toFixed(2):nd(q);const uShow=ing=>isOz(ing)?'oz':(ing?.unit||'');const ucShow=(ing,uc)=>isOz(ing)?uc*OZ:uc;
const mchip=(m,t)=>`<span class="chip ${m>=t?'good':m>=t-0.1?'warn':'bad'}">${pct(m)}</span>`;
const catName=(R,id)=>R.categories.find(c=>c.id===id)?.name||'Sin categoría';

async function openRest(id){curR=restById(id);await loadR(id);curTab='recipes';curCat='all';recQ='';mpF='all';mpQ='';go('rest');renderRest()}
$('#rEdit').onclick=()=>openCard(curR);
$$('#rTabs .tab').forEach(t=>t.onclick=()=>{curTab=t.dataset.tab;renderRest()});
function renderRest(){
  if(!curR)return;const R=S.r[curR.id];
  $('#rName').textContent=curR.name;const lg=$('#rLogo');lg.style.background=tone(curR);lg.innerHTML=rFace(curR);
  $$('#rTabs .tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===curTab));
  const B=$('#rBody');B.innerHTML={recipes:recipesView,mp:mpView,global:globalView,export:exportView}[curTab](R);bindRest(R);
}
function recipesView(R){
  const q=norm(recQ);const list=R.recipes.filter(r=>(curCat==='all'||(curCat==='none'?!R.categories.some(c=>c.id===r.cat):r.cat===curCat))&&(!q||norm(r.name).includes(q)||norm(catName(R,r.cat)).includes(q)));
  const sum=R.recipes.map(r=>calc(r,R));const avgM=sum.length?sum.reduce((a,c)=>a+c.margin,0)/sum.length:0;
  const groups=curCat==='all'?[...R.categories.map(c=>({c,items:list.filter(r=>r.cat===c.id)})),{c:{id:'none',name:'Sin categoría'},items:list.filter(r=>!R.categories.some(c=>c.id===r.cat))}].filter(g=>g.items.length):[{c:null,items:list}];
  const card=r=>{const c=calc(r,R);return `<button class="rc" data-open="${r.id}">${r.example?'<span class="ex">Ejemplo</span>':''}<h3>${esc(r.name)}</h3><span class="muted small">${c.portions} porción${c.portions>1?'es':''} · ${r.items.length} ingredientes</span><div class="k3"><div><small>Costo/porción</small><b class="num">${money(c.perPortion)}</b></div><div><small>Precio</small><b class="num">${money(c.price)}</b></div><div><small>Ganancia</small><b>${mchip(c.margin,c.target)}</b></div></div>${!r.items.length?`<span class="miss">⚠ Sin ingredientes: falta la receta</span>`:c.missing.length?`<span class="miss">⚠ Falta precio de ${c.missing.length} ingrediente${c.missing.length>1?'s':''}</span>`:''}</button>`};
  return `<div class="stack">
  <div class="kpis"><div class="kpi hl"><small>Recetas</small><b class="num">${R.recipes.length}</b></div><div class="kpi"><small>Margen promedio</small><b class="num">${pct(avgM)}</b></div><div class="kpi"><small>Categorías</small><b class="num">${R.categories.length}</b></div><div class="kpi"><small>Materias primas</small><b class="num">${R.ingredients.length}</b></div></div>
  <div class="tabs" style="padding-top:0"><button class="tab" data-cat="all" aria-selected="${curCat==='all'}">Todas</button>${R.categories.map(c=>`<button class="tab" data-cat="${c.id}" aria-selected="${curCat===c.id}">${esc(c.name)}</button>`).join('')}<button class="tab" data-act="cats">✎ Categorías</button></div>
  <div class="rowx"><input class="in" id="recQ" type="search" placeholder="🔍 Buscar receta…" value="${esc(recQ)}" style="flex:1;min-width:160px;border-radius:999px"><button class="btn ghost" data-act="orderRecipes">↕ Ordenar recetas</button><button class="btn" data-act="newRecipe">+ Nueva receta</button></div>
  ${q?`<span class="muted small">${list.length} resultado(s) para “${esc(recQ)}”</span>`:''}
  ${list.length?groups.map(g=>`${g.c?`<h2 class="sec" style="margin-top:6px">${esc(g.c.name)} <span class="muted small">${g.items.length}</span></h2>`:''}<div class="rlist">${g.items.map(card).join('')}</div>`).join(''):`<div class="empty card">No hay recetas aquí todavía. Carga la materia prima y crea la primera con “Nueva receta”.</div>`}
  </div>`;
}
let mpF='all',mpQ='';
function mpView(R){
  const usesOf=i=>R.recipes.filter(r=>r.items.some(x=>x.ing===i.id)).length;
  const L=[...R.ingredients].sort((a,b)=>(a.name||'').localeCompare(b.name||'','es'));
  const np=L.filter(i=>!(nd(i.price)>0)).length,un=L.filter(i=>!usesOf(i)).length;
  const F=[['all','Todas',L.length],['noprice','⚠ Sin precio',np],['used','En recetas',L.length-un],['unused','Sin usar',un]];
  return `<div class="stack">
  <div class="rowx"><h2 class="sec">Materia prima</h2><span class="muted small">Costo por unidad = precio ÷ (presentación × rendimiento)</span><span class="sp"></span><button class="btn" data-act="addIng">+ Ingrediente</button></div>
  <div class="rowx"><input class="in" id="mpQ" type="search" placeholder="🔍 Buscar materia prima…" value="${esc(mpQ)}" style="flex:1;min-width:180px;border-radius:999px"></div>
  <div class="tabs" style="padding-top:0">${F.map(([k,l,n])=>`<button class="tab" data-mpf="${k}" aria-selected="${mpF===k}">${l} · ${n}</button>`).join('')}</div>
  <span class="muted small" id="mpCount"></span>
  <div class="tbl-wrap"><table><thead><tr><th>Ingrediente</th><th>Unidad</th><th>Presentación</th><th>Precio compra</th><th>Rendimiento %</th><th>Costo/unidad</th><th>En recetas</th><th></th></tr></thead><tbody>
  ${L.map(i=>{const uses=usesOf(i);return `<tr data-ing="${i.id}" data-uses="${uses}"><td class="w-name"><input class="in" data-f="name" value="${esc(i.name)}"></td><td><select class="in" data-f="unit">${UNITS.map(u=>`<option ${u===i.unit?'selected':''}>${u}</option>`).join('')}</select></td><td><input class="in num" data-f="pack" inputmode="decimal" value="${i.pack}" style="width:90px"></td><td><input class="in num" data-f="price" inputmode="numeric" value="${i.price||''}" placeholder="⚠ sin precio" style="width:110px"></td><td><input class="in num" data-f="yield" inputmode="decimal" value="${i.yield??100}" style="width:70px"></td><td class="num" data-uc><b>${money(unitCost(i))}</b>/${esc(i.unit)}</td><td class="num">${uses}</td><td><button class="x" data-del-ing="${i.id}" aria-label="Eliminar">✕</button></td></tr>`}).join('')}
  </tbody></table></div>${R.ingredients.length?'':'<div class="empty">Agrega tu primer ingrediente con su presentación y precio de compra.</div>'}</div>`;
}
function mpFilter(R){
  const q=norm(mpQ);let shown=0;
  $$('#rBody tr[data-ing]').forEach(tr=>{const i=R.ingredients.find(x=>x.id===tr.dataset.ing);if(!i)return;const uses=+tr.dataset.uses;
    const ok=(!q||norm(i.name).includes(q))&&(mpF==='all'||(mpF==='noprice'&&!(nd(i.price)>0))||(mpF==='used'&&uses>0)||(mpF==='unused'&&uses===0));
    tr.hidden=!ok;if(ok)shown++});
  const c=$('#mpCount');if(c)c.textContent=shown?`${shown} materia(s) prima(s)`:'Nada con ese filtro';
}
function globalView(R){
  return `<div class="stack wrapmax">
  <div class="card stack"><b>Valores por defecto de este restaurante</b><span class="muted small">Aplican a las recetas que no tienen valor propio.</span>
   <div class="grid2"><div class="field"><label for="gErr">Margen de error %</label><input class="in num" id="gErr" inputmode="decimal" value="${R.settings.error}"></div><div class="field"><label for="gTar">Margen de ganancia objetivo %</label><input class="in num" id="gTar" inputmode="decimal" value="${R.settings.target}"></div><div class="field"><label for="gOpx">Aporte a gastos operativos %</label><input class="in num" id="gOpx" inputmode="decimal" value="${R.settings.opex??0}"></div></div>
   <span class="muted small">Precio sugerido = costo por porción ÷ (1 − ganancia − gastos operativos).</span>
   <div class="rowx"><button class="btn" data-act="saveDefaults">Guardar valores</button></div></div>
  <div class="card stack"><b>Cambiar todas las recetas a la vez</b>
   <div class="field"><label for="gScope">Aplicar a</label><select class="in" id="gScope"><option value="all">Todas las recetas</option>${R.categories.map(c=>`<option value="${c.id}">Solo ${esc(c.name)}</option>`).join('')}</select></div>
   <div class="grid2"><div class="field"><label for="gAllErr">Margen de error %</label><input class="in num" id="gAllErr" inputmode="decimal" placeholder="Ej: 5"></div><div class="field"><label for="gAllTar">Margen objetivo %</label><input class="in num" id="gAllTar" inputmode="decimal" placeholder="Ej: 30"></div><div class="field"><label for="gAllOpx">Aporte a gastos operativos %</label><input class="in num" id="gAllOpx" inputmode="decimal" placeholder="Ej: 25"></div>
   <div class="field"><label for="gPrice">Subir o bajar precios de venta %</label><input class="in num" id="gPrice" inputmode="decimal" placeholder="Ej: 8 o -5"></div><div class="field"><label for="gMp">Subir o bajar materia prima %</label><input class="in num" id="gMp" inputmode="decimal" placeholder="Ej: 10"></div></div>
   <label class="rowx small"><input type="checkbox" id="gSuggest"> Poner el precio sugerido según ganancia y gastos operativos</label>
   <div class="rowx"><button class="btn" data-act="applyAll">Aplicar</button></div></div></div>`;
}
function exportView(R){
  return `<div class="stack wrapmax"><div class="card stack"><b>Elige qué exportar</b><span class="muted small">Cada receta va en su hoja, con un resumen y la materia prima usada.</span>
  <label class="rowx"><input type="checkbox" id="exAll" checked> <b>Todas las recetas</b></label>
  <div class="stack" id="exList">${R.recipes.map(r=>`<label class="rowx"><input type="checkbox" data-ex="${r.id}" checked> ${esc(r.name)} <span class="muted small">${esc(catName(R,r.cat))}</span></label>`).join('')||'<span class="muted">No hay recetas todavía.</span>'}</div>
  <div class="rowx"><button class="btn" data-act="doExport">Descargar Excel</button></div></div></div>`;
}
function bindRest(R){
  const B=$('#rBody'),act=(a,f)=>{const b=B.querySelector(`[data-act="${a}"]`);if(b)b.onclick=f};
  B.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openRecipe(b.dataset.open));
  B.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{curCat=b.dataset.cat;renderRest()});
  act('cats',()=>openCats(R));
  act('orderRecipes',()=>openRecipeOrder(R));
  const rq=$('#recQ');if(rq)rq.oninput=()=>{recQ=rq.value;renderRest();setTimeout(()=>{const x=$('#recQ');if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length)}},20)};
  act('newRecipe',()=>{const r={id:uid(),name:'Nueva receta',cat:curCat!=='all'&&curCat!=='none'?curCat:(R.categories[0]?.id||null),portions:1,price:0,error:null,target:null,items:[]};R.recipes.push(r);saveR(curR.id);openRecipe(r.id)});
  act('addIng',()=>{const id=uid();R.ingredients.push({id,name:'',unit:'g',pack:1000,price:0,yield:100});mpF='all';mpQ='';saveR(curR.id);renderRest();setTimeout(()=>{const el=$(`#rBody tr[data-ing="${id}"] [data-f="name"]`);if(el){el.scrollIntoView({block:'center'});el.focus()}},60)});
  if($('#mpQ')){mpFilter(R);$('#mpQ').oninput=e=>{mpQ=e.target.value;mpFilter(R)};B.querySelectorAll('[data-mpf]').forEach(b=>b.onclick=()=>{mpF=b.dataset.mpf;B.querySelectorAll('[data-mpf]').forEach(x=>x.setAttribute('aria-selected',x===b));mpFilter(R)})}
  B.querySelectorAll('tr[data-ing]').forEach(tr=>{const ing=R.ingredients.find(i=>i.id===tr.dataset.ing);tr.querySelectorAll('[data-f]').forEach(inp=>{const upd=()=>{const f=inp.dataset.f;ing[f]=f==='price'?pm(inp.value):['pack','yield'].includes(f)?nd(inp.value):inp.value;saveR(curR.id);const uc=tr.querySelector('[data-uc]');if(uc)uc.innerHTML=`<b>${money(unitCost(ing))}</b>/${esc(ing.unit)}`};if(inp.tagName==='SELECT')inp.onchange=upd;else{inp.oninput=upd;inp.onchange=upd}})});
  B.querySelectorAll('[data-del-ing]').forEach(b=>b.onclick=()=>{const id=b.dataset.delIng;const used=R.recipes.filter(r=>r.items.some(x=>x.ing===id));if(used.length&&b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='?';toast(`Está en ${used.length} receta(s). Toca otra vez para eliminar.`);return}R.ingredients=R.ingredients.filter(i=>i.id!==id);R.recipes.forEach(r=>r.items=r.items.filter(x=>x.ing!==id));saveR(curR.id);renderRest()});
  act('saveDefaults',()=>{R.settings.error=nd($('#gErr').value);R.settings.target=nd($('#gTar').value);R.settings.opex=nd($('#gOpx').value);saveR(curR.id);toast('Valores guardados')});
  act('applyAll',()=>{const sc=$('#gScope').value,e=$('#gAllErr').value,t=$('#gAllTar').value,ox=$('#gAllOpx').value,p=$('#gPrice').value,m=$('#gMp').value,sg=$('#gSuggest').checked;
    if(m!=='')R.ingredients.forEach(i=>i.price=Math.round(nd(i.price)*(1+nd(m)/100)));
    R.recipes.filter(r=>sc==='all'||r.cat===sc).forEach(r=>{if(e!=='')r.error=nd(e);if(t!=='')r.target=nd(t);if(ox!=='')r.opex=nd(ox);if(p!=='')r.price=Math.round(nd(r.price)*(1+nd(p)/100));if(sg)r.price=Math.ceil(calc(r,R).suggested/100)*100});
    if([e,t,ox,p,m].every(x=>x==='')&&!sg)return toast('No escribiste ningún cambio');saveR(curR.id);toast('Cambios aplicados');renderRest()});
  const all=$('#exAll');if(all)all.onchange=()=>B.querySelectorAll('[data-ex]').forEach(x=>x.checked=all.checked);
  act('doExport',()=>{const ids=[...B.querySelectorAll('[data-ex]:checked')].map(x=>x.dataset.ex);if(!ids.length)return toast('Elige al menos una receta');exportRecipes(R,ids)});
}
function openCats(R){
  const P=$('#genPane');const draw=()=>{P.innerHTML=`<h2>Categorías de ${esc(curR.name)}</h2><span class="muted small">Ordénalas como van en la carta.</span>
   <div class="stack">${R.categories.map((c,i)=>`<div class="rowx"><input class="in" data-cn="${c.id}" value="${esc(c.name)}" style="flex:1"><button class="x" data-up="${i}" aria-label="Subir" ${i===0?'disabled':''}>▲</button><button class="x" data-down="${i}" aria-label="Bajar" ${i===R.categories.length-1?'disabled':''}>▼</button><button class="x" data-dc="${c.id}" aria-label="Eliminar">✕</button></div>`).join('')||'<span class="muted">Sin categorías todavía.</span>'}</div>
   <form class="rowx" id="catForm"><input class="in" id="catNew" placeholder="Nueva categoría, ej: Hamburguesas" style="flex:1"><button class="btn">Añadir</button></form>
   <div class="rowx"><span class="sp"></span><button class="btn ghost" id="catDone">Listo</button></div>`;
   P.querySelectorAll('[data-cn]').forEach(i=>i.onchange=()=>{R.categories.find(c=>c.id===i.dataset.cn).name=i.value.trim()||'Sin nombre';saveR(curR.id)});
   P.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=+b.dataset.up;if(i>0){[R.categories[i-1],R.categories[i]]=[R.categories[i],R.categories[i-1]];saveR(curR.id);draw()}});
   P.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{const i=+b.dataset.down;if(i<R.categories.length-1){[R.categories[i+1],R.categories[i]]=[R.categories[i],R.categories[i+1]];saveR(curR.id);draw()}});
   P.querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>{R.categories=R.categories.filter(c=>c.id!==b.dataset.dc);R.recipes.forEach(r=>{if(r.cat===b.dataset.dc)r.cat=null});saveR(curR.id);draw()});
   $('#catForm').onsubmit=e=>{e.preventDefault();const v=$('#catNew').value.trim();if(!v)return;R.categories.push({id:uid(),name:v});saveR(curR.id);draw();$('#catNew').focus()};
   $('#catDone').onclick=()=>{$('#genSheet').hidden=true;renderRest()}};
  draw();$('#genSheet').hidden=false;
}
function openRecipeOrder(R){
  const P=$('#genPane');let selected=curCat==='all'?'':curCat;
  const draw=()=>{const items=R.recipes.filter(r=>selected?(selected==='__none__'?!R.categories.some(c=>c.id===r.cat):r.cat===selected):true);
    P.innerHTML=`<h2>Ordenar recetas de ${esc(curR.name)}</h2><span class="muted small">Usa las flechas para cambiar el orden. Se guarda automáticamente.</span>
    <div class="field"><label for="orderCat">Categoría</label><select class="in" id="orderCat"><option value="">Todas las recetas</option>${R.categories.map(c=>`<option value="${c.id}" ${selected===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}<option value="__none__" ${selected==='__none__'?'selected':''}>Sin categoría</option></select></div>
    <div class="stack">${items.map((r,i)=>`<div class="rowx card" style="padding:8px 10px"><span class="num muted" style="width:28px">${i+1}.</span><b style="flex:1">${esc(r.name)}</b><button class="x" data-rup="${r.id}" aria-label="Subir" ${i===0?'disabled':''}>▲</button><button class="x" data-rdown="${r.id}" aria-label="Bajar" ${i===items.length-1?'disabled':''}>▼</button></div>`).join('')||'<span class="muted">No hay recetas en esta categoría.</span>'}</div>
    <div class="rowx"><span class="sp"></span><button class="btn ghost" id="recipeOrderDone">Listo</button></div>`;
    $('#orderCat').onchange=e=>{selected=e.target.value;draw()};
    const move=(id,delta)=>{const peers=R.recipes.filter(r=>selected?(selected==='__none__'?!R.categories.some(c=>c.id===r.cat):r.cat===selected):true),p=peers.findIndex(r=>r.id===id),q=p+delta;if(p<0||q<0||q>=peers.length)return;const a=R.recipes.indexOf(peers[p]),b=R.recipes.indexOf(peers[q]);[R.recipes[a],R.recipes[b]]=[R.recipes[b],R.recipes[a]];saveR(curR.id);draw()};
    P.querySelectorAll('[data-rup]').forEach(b=>b.onclick=()=>move(b.dataset.rup,-1));P.querySelectorAll('[data-rdown]').forEach(b=>b.onclick=()=>move(b.dataset.rdown,1));
    $('#recipeOrderDone').onclick=()=>{$('#genSheet').hidden=true;renderRest()};
  };draw();$('#genSheet').hidden=false;
}
$('#genSheet').onclick=e=>{if(e.target.id==='genSheet'){$('#genSheet').hidden=true;const c=$$('.screen').find(s=>!s.hidden)?.id;if(c==='rest')renderRest()}};

/* ---------- receta ---------- */
let curRec=null;
function openRecipe(id){curRec=S.r[curR.id].recipes.find(r=>r.id===id);go('recipe');renderRecipe()}
function missHTML(c){if(!c.lines.length)return `<div class="missbox">⚠ <b>Esta receta todavía no tiene ingredientes.</b> Agrégalos abajo con “Añadir de materia prima”; si el producto no existe, créalo primero en Materia prima.</div>`;return c.missing.length?`<div class="missbox">⚠ <b>Falta precio:</b> ${[...new Set(c.missing)].map(esc).join(', ')}. El costo de esta receta sale más bajo de lo real hasta que los completes en Materia prima.</div>`:''}
function renderRecipe(){
  const R=S.r[curR.id],r=curRec,c=calc(r,R);$('#reTitle').textContent=r.name||'Receta';
  $('#reBody').innerHTML=`<div class="stack">
   ${r.example?'<span class="ex">Receta de ejemplo: cámbiala o elimínala</span>':''}
   <div class="grid3"><div class="field span2"><label for="fName">Nombre</label><input class="in" id="fName" value="${esc(r.name)}"></div><div class="field"><label for="fCat">Categoría</label><select class="in" id="fCat"><option value="">Sin categoría</option>${R.categories.map(k=>`<option value="${k.id}" ${k.id===r.cat?'selected':''}>${esc(k.name)}</option>`).join('')}</select></div>
   <div class="field"><label for="fPor">Porciones que rinde</label><input class="in num" id="fPor" inputmode="decimal" value="${r.portions}"></div><div class="field"><label for="fPrice">Precio de venta por porción</label><input class="in num" id="fPrice" inputmode="numeric" value="${r.price}"></div><div class="field"><label for="fErr">Margen de error %</label><input class="in num" id="fErr" inputmode="decimal" value="${r.error??''}" placeholder="${R.settings.error} (general)"></div><div class="field"><label for="fTar">Margen de ganancia %</label><input class="in num" id="fTar" inputmode="decimal" value="${r.target??''}" placeholder="${R.settings.target} (general)"></div><div class="field"><label for="fOpx">Aporte a gastos operativos %</label><input class="in num" id="fOpx" inputmode="decimal" value="${r.opex??''}" placeholder="${R.settings.opex??0} (general)"></div></div>
   <div id="missBox">${missHTML(c)}</div>
   <div class="kpis">
    <div class="kpi"><small>Costo ingredientes</small><b class="num" data-o="base">${money(c.base)}</b></div><div class="kpi"><small>+ Margen de error (<span data-o="err">${pct(c.err)}</span>)</small><b class="num" data-o="total">${money(c.total)}</b></div>
    <div class="kpi"><small>Costo por porción</small><b class="num" data-o="perPortion">${money(c.perPortion)}</b></div><div class="kpi"><small>Food cost</small><b class="num" data-o="foodCost">${pct(c.foodCost)}</b></div>
    <div class="kpi"><small>Aporte a gastos operativos (<span data-o="opex">${pct(c.opex)}</span>) / porción</small><b class="num" data-o="contrib">${money(c.opexAmt)}</b></div>
    <div class="kpi"><small>Ganancia / porción</small><b class="num" data-o="net">${money(c.net)}</b></div><div class="kpi hl"><small>Margen de ganancia</small><b class="num" data-o="margin">${pct(c.margin)}</b></div>
    <div class="kpi"><small>Ganancia por tanda (<span data-o="portions">${c.portions}</span>)</small><b class="num" data-o="netTotal">${money(c.netTotal)}</b></div><div class="kpi"><small>Precio sugerido (ganancia <span data-o="target">${pct(c.target)}</span> + gastos <span data-o="opex">${pct(c.opex)}</span>)</small><b class="num" data-o="suggested">${money(c.suggested)}</b> <button class="btn sm ghost" id="useSug" style="margin-top:6px">Usar</button></div></div>

async function saveXlsx(wb,fname){

  try{await dl.save({filename:fname,data:new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})});toast('Excel listo')}catch(e){toast(e.code==='declined'?'Descarga cancelada':'No se pudo descargar ('+(e.code||'error')+')')}
}
const sheetName=(wb,s)=>{let nm=(s||'Hoja').replace(/[\\\/\?\*\[\]:]/g,'').slice(0,28)||'Hoja';let k=2;while(wb.SheetNames.includes(nm))nm=nm.slice(0,25)+' '+k++;return nm};
function exportRecipes(R,ids){

  const ws0=XLSX.utils.aoa_to_sheet(sum);ws0['!cols']=sum[0].map((h,i)=>({wch:i?16:28}));XLSX.utils.book_append_sheet(wb,ws0,'Resumen');const used=new Set();
  recs.forEach(r=>{const c=calc(r,R);const rows=[[r.name],['Categoría',catName(R,r.cat)],['Porciones',c.portions],[],['Ingrediente','Cantidad','Unidad','Costo por unidad','Costo en receta','% participación']];
    c.lines.forEach(l=>{used.add(l.it.ing);rows.push([l.ing?.name||'',nd(l.it.qty),l.ing?.unit||'',+l.uc.toFixed(2),Math.round(l.cost),+(l.share*100).toFixed(1)])});
    rows.push([],['Costo ingredientes','','','',Math.round(c.base)],['Margen de error %','','','',c.err*100],['Costo total','','','',Math.round(c.total)],['Costo por porción','','','',Math.round(c.perPortion)],['Precio de venta','','','',c.price],['Food cost %','','','',+(c.foodCost*100).toFixed(1)],['Aporte a gastos operativos %','','','',+(c.opex*100).toFixed(1)],['Aporte a gastos operativos por porción','','','',Math.round(c.opexAmt)],['Ganancia por porción','','','',Math.round(c.net)],['Margen de ganancia %','','','',+(c.margin*100).toFixed(1)],['Precio sugerido','','','',Math.round(c.suggested)]);
    const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:34},{wch:10},{wch:8},{wch:16},{wch:16},{wch:15}];XLSX.utils.book_append_sheet(wb,ws,sheetName(wb,r.name))});
  const mp=[['Ingrediente','Unidad','Presentación','Precio compra','Rendimiento %','Costo por unidad']];R.ingredients.filter(i=>used.has(i.id)).forEach(i=>mp.push([i.name,i.unit,nd(i.pack),nd(i.price),nd(i.yield??100),+unitCost(i).toFixed(2)]));
  const ws2=XLSX.utils.aoa_to_sheet(mp);ws2['!cols']=[{wch:28},{wch:8},{wch:13},{wch:14},{wch:13},{wch:15}];XLSX.utils.book_append_sheet(wb,ws2,'Materia prima');

function analyze(R,per,cat){
  const rows=R.recipes.filter(r=>cat==='all'||r.cat===cat).map(r=>{const u=nd(per.units?.[r.id]);const c=calc(r,R);return{r,u,cm:c.contrib,price:c.price}}).filter(x=>x.u>0);
  const N=rows.length,tu=rows.reduce((a,x)=>a+x.u,0);if(!N||!tu)return{rows:[],N:0};
  const avgCM=rows.reduce((a,x)=>a+x.cm*x.u,0)/tu;const popT=(1/N)*0.7;
  rows.forEach(x=>{x.mix=x.u/tu;x.hiPop=x.mix>=popT;x.hiCM=x.cm>=avgCM;x.cls=x.hiPop&&x.hiCM?'pole':x.hiPop?'podio':x.hiCM?'rookie':'box';x.totCM=x.cm*x.u});
  return{rows,N,tu,avgCM,popT};
}
function quadSVG(a){
  const W=600,H=420,pad=46;const maxU=Math.max(...a.rows.map(x=>x.mix))*1.15||1;const cms=a.rows.map(x=>x.cm);const minC=Math.min(0,...cms),maxC=Math.max(...cms)*1.15||1;

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Matriz de ventas y rentabilidad">
   <rect x="${px}" y="${pad}" width="${W-pad-px}" height="${py-pad}" fill="var(--pole)" opacity=".12"/><rect x="${pad}" y="${pad}" width="${px-pad}" height="${py-pad}" fill="var(--rookie)" opacity=".12"/>
   <rect x="${px}" y="${py}" width="${W-pad-px}" height="${H-pad-py}" fill="var(--podio)" opacity=".12"/><rect x="${pad}" y="${py}" width="${px-pad}" height="${H-pad-py}" fill="var(--box)" opacity=".14"/>
   <line x1="${px}" y1="${pad}" x2="${px}" y2="${H-pad}" stroke="var(--muted)" stroke-dasharray="4 4"/><line x1="${pad}" y1="${py}" x2="${W-pad}" y2="${py}" stroke="var(--muted)" stroke-dasharray="4 4"/>
   <text x="${W-pad-6}" y="${pad+16}" text-anchor="end" font-size="13" font-weight="800" fill="var(--pole)">POLE</text><text x="${pad+6}" y="${pad+16}" font-size="13" font-weight="800" fill="var(--rookie)">ROOKIE</text>
   <text x="${W-pad-6}" y="${H-pad-8}" text-anchor="end" font-size="13" font-weight="800" fill="var(--podio)">PODIO</text><text x="${pad+6}" y="${H-pad-8}" font-size="13" font-weight="800" fill="var(--box)">BOX</text>
   <text x="${W/2}" y="${H-12}" text-anchor="middle" font-size="12" fill="var(--muted)">Participación en ventas →</text><text transform="translate(14 ${H/2}) rotate(-90)" text-anchor="middle" font-size="12" fill="var(--muted)">Aporte por unidad →</text>
   ${a.rows.map(x=>`<g><circle cx="${X(x.mix)}" cy="${Y(x.cm)}" r="7" fill="var(--${x.cls})" stroke="var(--panel)" stroke-width="2"/><text x="${X(x.mix)+10}" y="${Y(x.cm)+4}" font-size="11.5" font-weight="700" fill="var(--fg)">${esc(x.r.name.length>18?x.r.name.slice(0,17)+'…':x.r.name)}</text></g>`).join('')}</svg>`;
}

  B.querySelectorAll('[data-ifor]').forEach(b=>b.onclick=()=>{ideaFor=b.dataset.ifor;const t=$('#idText').value,l=$('#idLink').value;renderIdeasKeep(t,l)});
  B.querySelectorAll('[data-if]').forEach(b=>b.onclick=()=>{ideaF=b.dataset.if;if(ideaF!=='all')ideaFor=ideaF;renderIdeas()});
  $('#idFile').onchange=async e=>{const f=e.target.files[0];if(f){ideaImg=await shrink(f,1000,'image/jpeg',.75);toast('Imagen lista')}};
  $('#idForm').onsubmit=e=>{e.preventDefault();const t=$('#idText').value.trim();let link=$('#idLink').value.trim();if(!t&&!link&&!ideaImg)return toast('Escribe la idea');if(link&&!/^https?:\/\//i.test(link))link='https://'+link;
    S.ideas.items.push({id:uid(),rid:ideaFor,text:t,link,img:ideaImg?storeImg(ideaImg):null,date:today()});ideaImg=null;save('ideas',S.ideas);blip(1200,.08);toast('Idea guardada 💡');renderIdeas()};
  B.querySelectorAll('[data-idel]').forEach(b=>b.onclick=()=>{if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='?';return}const it=L.find(x=>x.id===b.dataset.idel);if(it?.img)delDoc('img_'+it.img);S.ideas.items=L.filter(x=>x.id!==b.dataset.idel);save('ideas',S.ideas);renderIdeas()});
}
function renderIdeasKeep(t,l){renderIdeas();setTimeout(()=>{$('#idText').value=t;$('#idLink').value=l},5)}

/* ---------- configuración ---------- */
function renderSettings(){
  const st=S.meta.settings,B=$('#setBody');
  const sw=(k,t,d)=>`<div class="setrow"><div class="t"><b>${t}</b><small>${d}</small></div><button class="switch" role="switch" data-sw="${k}" aria-checked="${!!st[k]}" aria-label="${t}"></button></div>`;
  B.innerHTML=`<div class="stack wrapmax">
   <div class="card"><h2 class="sec">Tema</h2><div class="setrow"><div class="t"><b>Apariencia</b><small>Blanco o negro, como la consola</small></div><div class="seg">${[['system','Sistema'],['light','Blanco'],['dark','Negro']].map(([k,v])=>`<button data-th="${k}" aria-pressed="${st.theme===k}">${v}</button>`).join('')}</div></div>
    ${sw('sound','Sonidos de navegación','Clics suaves al moverte y abrir cosas')}${sw('oz','Líquidos en onzas','Las cantidades en ml de las recetas se muestran en oz (1 oz = 30 ml)')}</div>
   <div class="card"><h2 class="sec">Notificaciones</h2>${sw('taskDot','Punto en Tareas','Se enciende cuando una tarea es para hoy o está vencida')}${sw('debtDot','Punto en Controles','Se enciende cuando algún restaurante te debe')}</div>
   <div class="card stack"><h2 class="sec">Perfil y valores por defecto</h2><div class="grid3"><div class="field"><label for="stUser">Nombre arriba</label><input class="in" id="stUser" value="${esc(st.user)}"></div><div class="field"><label for="stErr">Margen de error % (nuevos restaurantes)</label><input class="in num" id="stErr" inputmode="decimal" value="${st.error}"></div><div class="field"><label for="stTar">Margen objetivo % (nuevos)</label><input class="in num" id="stTar" inputmode="decimal" value="${st.target}"></div></div></div>
   ${db?'':`<div class="card stack"><h2 class="sec">Datos publicados</h2><span class="muted small">Vuelve a cargar los restaurantes, recetas y eventos que Claude publicó con la última versión de la app. Reemplaza lo que tienes en este dispositivo.</span><div class="rowx"><button class="btn" id="pubLoad">Cargar datos publicados</button></div><div class="rowx" id="pubConfirm" hidden><span class="small" style="color:var(--bad)">Esto reemplaza todo lo de este dispositivo.</span><span class="sp"></span><button class="btn sm ghost" id="pubNo">Cancelar</button><button class="btn sm danger" id="pubYes">Reemplazar</button></div></div>`}
   <div class="card stack"><h2 class="sec">Copia de seguridad</h2><span class="muted small">Descarga todo (restaurantes, recetas, eventos, controles) en un archivo para guardarlo o pasarlo a la versión 1.0.</span><div class="rowx"><button class="btn" id="bkDown">Descargar copia</button><label class="btn ghost">Restaurar copia<input type="file" id="bkUp" accept=".json" hidden></label></div><div class="rowx" id="bkConfirm" hidden><span class="small" style="color:var(--bad)">Esto reemplaza todo lo que hay ahora.</span><span class="sp"></span><button class="btn sm ghost" id="bkNo">Cancelar</button><button class="btn sm danger" id="bkYes">Reemplazar</button></div></div>
   <div class="card"><div class="setrow"><div class="t"><b>Versión</b><small>Demo 0.6 · los datos se guardan en tu cuenta de Claude</small></div></div></div></div>`;
  B.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{st.theme=b.dataset.th;applyTheme();saveMeta();renderSettings()});
  B.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{st[b.dataset.sw]=!st[b.dataset.sw];saveMeta();blip(900);renderSettings()});
  $('#stUser').onchange=e=>{st.user=e.target.value.trim()||'Juan Beltran';saveMeta()};$('#stErr').onchange=e=>{st.error=nd(e.target.value);saveMeta()};$('#stTar').onchange=e=>{st.target=nd(e.target.value);saveMeta()};
  $('#bkDown').onclick=async()=>{await loadAllR();const data={app:'juan-beltran',version:'0.4',ideas:S.ideas,date:new Date().toISOString(),meta:S.meta,tasks:S.tasks,events:S.events,boards:S.boards,r:S.r};const dl=await getDL();if(!dl)return toast('Las descargas no están disponibles aquí');try{await dl.save({filename:`juan-beltran-copia-${today()}.json`,data:JSON.stringify(data)});toast('Copia descargada')}catch(e){toast('No se descargó')}};
  const pl=$('#pubLoad');if(pl){pl.onclick=()=>$('#pubConfirm').hidden=false;$('#pubNo').onclick=()=>$('#pubConfirm').hidden=true;
    $('#pubYes').onclick=async()=>{try{const r=await fetch('datos.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();Object.keys(localStorage).filter(k=>k.startsWith('jbapp_')&&!k.startsWith('jbapp_img_')).forEach(k=>localStorage.removeItem(k));for(const k in d)lsSet(k,d[k]);toast('Datos cargados');setTimeout(()=>location.reload(),600)}catch(e){toast('No se pudieron cargar los datos')}}}
  let pending=null;$('#bkUp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{pending=JSON.parse(await f.text());if(pending.app!=='juan-beltran')throw 0;$('#bkConfirm').hidden=false}catch(x){toast('Ese archivo no es una copia de esta app')}};
  $('#bkNo').onclick=()=>{pending=null;$('#bkConfirm').hidden=true};
  $('#bkYes').onclick=async()=>{const p=pending;S.meta=p.meta;S.tasks=p.tasks;S.events=p.events||{items:[]};S.boards=p.boards||{items:[]};S.ideas=p.ideas||{items:[]};S.r={};for(const id in p.r){S.r[id]=fixR(p.r[id]);await save('r_'+id,S.r[id],true)}await Promise.all([save('meta',S.meta,true),save('tasks',S.tasks,true),save('events',S.events,true),save('boards',S.boards,true)]);applyTheme();toast('Copia restaurada');renderSettings()};
}

document.addEventListener('focusin',e=>{const t=e.target;if(t.matches&&t.matches('input.num')&&t.select)setTimeout(()=>{try{t.select()}catch(x){}},0)});
/* el visor bloquea el envío de formularios: lo hacemos a mano */
function fakeSubmit(f){if(typeof f.onsubmit==='function')f.onsubmit({preventDefault(){},target:f,currentTarget:f})}
document.addEventListener('click',e=>{const b=e.target.closest('form button');if(!b||b.type==='button')return;const f=b.closest('form');e.preventDefault();fakeSubmit(f)},true);
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;const t=e.target;if(t.tagName!=='INPUT'||['checkbox','file','button'].includes(t.type))return;const f=t.closest('form');if(!f)return;e.preventDefault();fakeSubmit(f)},true);
/* render diferido: evita que el blur de un input choque con el redibujo */
renderRest=defer(renderRest);renderRecipe=defer(renderRecipe);renderSales=defer(renderSales);renderCtrl=defer(renderCtrl);renderEvents=defer(renderEvents);renderShop=defer(renderShop);renderTasks=defer(renderTasks);renderSettings=defer(renderSettings);renderIdeas=defer(renderIdeas);renderMood=defer(renderMood);
function defer(f){let q=false;return()=>{if(q)return;q=true;setTimeout(()=>{q=false;f()},0)}}
/* ---------- arranque ---------- */
const bar=p=>{const e=$('#splash');if(e&&!e.classList.contains('on'))e.style.setProperty('--b',(0.07+p/100*0.2).toFixed(3))};
let started=false;
function enter(){if(started)return;started=true;const sp=$('#splash');try{show('home');renderHome()}catch(e){console.error(e);toast('Error al abrir: '+e.message)}
  if(!sp)return;sp.classList.add('on');blip(180,.08);setTimeout(()=>blip(240,.05),260);setTimeout(()=>sp.classList.add('lit'),1150);setTimeout(()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),650)},2500)}
async function getDL(){let d=null;try{d=window.claude?await window.claude.use('downloads'):null}catch(e){}
  return d||{save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000)}}}
async function seedLocal(){if(db)return;const m0=lsGet('meta');if(m0&&(m0.restaurants||[]).length)return;try{const r=await fetch('datos.json',{cache:'no-store'});if(!r.ok)return;const d=await r.json();for(const k in d)lsSet(k,d[k])}catch(e){}}
async function migrateMiradorData(){
  const card=S.meta.restaurants.find(x=>x.id==='mirador'||norm(x.name).includes('mirador del cielo'));if(!card)return;const R=S.r[card.id];if(!R)return;let changed=false;
  const setIng=(id,name,pack,price,unit='g',yieldPct=100)=>{let x=R.ingredients.find(i=>i.id===id)||R.ingredients.find(i=>norm(i.name)===norm(name));if(!x){x={id,name,pack,price,unit,yield:yieldPct};R.ingredients.push(x);changed=true;return x}if(x.name!==name||x.pack!==pack||x.price!==price||x.unit!==unit||x.yield!==yieldPct){Object.assign(x,{name,pack,price,unit,yield:yieldPct});changed=true}return x};
  const berries=setIng('ifdw52oj','Arandanos',125,5900),straw=setIng('ah19arr2','Fresa',480,5600,'g',95),sugar=R.ingredients.find(i=>i.id==='k09jxkuo')||R.ingredients.find(i=>norm(i.name)==='azucar blanca');
  const jamIng=setIng('axumxp70','Mermelada',695,12128);
  R.ingredients.filter(i=>norm(i.name)==='sirope').forEach(i=>{i.name='Almíbar';changed=true});
  const syrups=R.ingredients.filter(i=>norm(i.name)==='almibar');
  if(syrups.length>1){const canonical=syrups.find(i=>i.id==='lk1ksgma')||syrups[0];for(const duplicate of syrups){if(duplicate===canonical)continue;R.recipes.forEach(rec=>rec.items.forEach(it=>{if(it.ing===duplicate.id)it.ing=canonical.id}));R.ingredients=R.ingredients.filter(i=>i.id!==duplicate.id);changed=true}canonical.name='Almíbar'}
  let cat=R.categories.find(c=>norm(c.name)==='subrecetas');if(!cat){cat={id:'eidc2guq',name:'Subrecetas'};R.categories.push(cat);changed=true}
  let rec=R.recipes.find(x=>x.id==='mrmld695'||norm(x.name)==='mermelada');if(!rec){rec={id:'mrmld695',name:'Mermelada',cat:cat.id,items:[],portions:1,price:0,error:null,target:null};R.recipes.push(rec);changed=true}
  if(sugar&&(!rec.items||!rec.items.length)){rec.items=[{ing:berries.id,qty:125},{ing:straw.id,qty:480},{ing:sugar.id,qty:90}];rec.cat=cat.id;rec.portions=1;changed=true}
  if(changed)await saveR(card.id,true);
}
async function boot(){
  const t0=Date.now();bar(12);
  try{db=window.claude?await withTimeout(window.claude.use('db'),5000):null}catch(e){console.warn('db',e);db=null}
  bar(35);await seedLocal();
  try{
    const [m,t,ev,bo,idd]=await Promise.all([readDoc('meta'),readDoc('tasks'),readDoc('events'),readDoc('boards'),readDoc('ideas')]);
    if(m&&typeof m==='object'){S.meta=Object.assign({restaurants:[]},m);S.meta.settings=Object.assign({...DEF_SET},m.settings||{})}
    if(t?.items)S.tasks=t;if(ev?.items)S.events=ev;if(bo?.items)S.boards=bo;if(idd?.items)S.ideas=idd;
  }catch(e){console.error(e)}
  bar(65);applyTheme();
  try{await loadAllR();await migrateMiradorData()}catch(e){console.error(e)}
  bar(90);
  setTimeout(enter,Math.max(0,700-(Date.now()-t0)));
}
setTimeout(()=>{if(!started){const m=$('#splMsg');if(m)m.textContent='Abriendo sin conexión…'}enter()},8000);
boot().catch(e=>{console.error(e);enter()});
})();
</script>
